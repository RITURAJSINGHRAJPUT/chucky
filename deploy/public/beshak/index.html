<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beshak · Menu Editor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:wght@400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>

:root{
  --ink:#0E0D0B;--panel:#161410;--card:#1E1B15;--card2:#242017;
  --cream:#F4ECDD;--cream-dim:#CFC6B4;--muted:#8F8676;
  --line:rgba(244,236,221,.10);--line2:rgba(244,236,221,.17);
  --red:#D04128;--aiko:#D04128;--ac:#D04128;--aiko-soft:rgba(208,65,40,.15);--aiko-line:rgba(208,65,40,.45);
  --ok:#5FB07C;--warn:#E0912B;--bad:#E5675E;
  --paper:#F6EFE2;
  --serif:'Lora',Georgia,serif;--mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--mono);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--aiko);color:#fff}
#boot{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#boot svg{color:var(--aiko)!important;fill:var(--aiko)!important}
#boot .s{color:var(--muted);font-family:var(--mono);font-size:13px;letter-spacing:.4px}
.spin{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--aiko);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- top bar ---- */
header.bar{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141209,#100E09);position:relative;z-index:20}
.home{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--muted);border:1px solid var(--line2);font-size:15px;text-decoration:none}
.home:hover{color:var(--cream);border-color:var(--aiko-line)}
.brand{display:flex;align-items:center;gap:11px}
.brand .wm{height:30px;width:auto;color:var(--aiko)}
.brand .tag{font-size:10.5px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.homelink{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);margin-right:2px}
.homelink:hover{color:var(--cream)}
.homelink:hover .chucky{transform:translateY(-2px)}
.homelink .chucky{width:30px;height:30px;color:var(--aiko);transition:transform .2s}
.homelink .bhint{font-size:14px}
.homelink .ctag{display:none}
.search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:#100E09;border:1px solid var(--line2);border-radius:9px;padding:7px 11px;transition:.15s}
.search:focus-within{border-color:var(--aiko-line)}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.search input{flex:1;background:none;border:none;outline:none;color:var(--cream);font-family:var(--mono);font-size:13px}
.search input::placeholder{color:var(--muted)}
.search kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:#0d0b07}
.spacer{flex:1}
.pill{font-size:12px;font-weight:500;letter-spacing:.02em;padding:6px 12px;border-radius:999px;border:1px solid;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);border-color:rgba(95,176,124,.4);background:rgba(95,176,124,.08)}
.pill.bad{color:var(--bad);border-color:rgba(229,103,94,.45);background:rgba(229,103,94,.1)}
#persona{background:transparent;color:var(--cream,#F4ECDD);border:1px solid var(--line2,rgba(244,236,221,.2));font-weight:600;letter-spacing:.02em;padding:9px 14px;border-radius:9px;font-size:13px;transition:.15s;margin-right:8px}
#persona:hover,#persona.on{border-color:var(--aiko);color:var(--aiko)}
.persov{position:fixed;inset:0;background:rgba(6,5,3,.74);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:130;padding:20px}
.perscard{background:var(--panel,#17150f);border:1px solid var(--line2,rgba(244,236,221,.2));border-radius:16px;padding:20px;width:min(400px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pershd{font-size:14px;color:var(--cream,#F4ECDD);margin-bottom:16px;display:flex;flex-direction:column;gap:3px}
.pershd span{font-size:11px;color:var(--muted,#8F8676);font-weight:400}
.perslbl{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted,#8F8676);margin:12px 2px 6px}
.perssel,.persocc,.persguest{width:100%;box-sizing:border-box;background:#100e09;border:1px solid var(--line2,rgba(244,236,221,.2));border-radius:9px;color:var(--cream,#F4ECDD);font-family:var(--mono,ui-monospace,monospace);font-size:14px;padding:10px 12px;outline:none;margin-bottom:2px}
.persocc,.persguest{text-transform:uppercase;font-weight:700;letter-spacing:.4px;margin-top:8px}
.perssel:focus,.persocc:focus,.persguest:focus{border-color:var(--aiko)}
.persfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.cropbtn{font:inherit;font-size:12.5px;color:var(--cream-dim,#CFC6B4);background:transparent;border:1px solid var(--line2,rgba(244,236,221,.2));border-radius:8px;padding:9px 16px;cursor:pointer;transition:.13s}
.cropbtn:hover{border-color:var(--aiko);color:var(--cream,#F4ECDD)}
.cropbtn.save{background:var(--aiko);color:#1a1400;border-color:var(--aiko);font-weight:700}
.cropbtn.ghost{color:var(--muted,#8F8676)}
#fullprev{background:transparent;color:var(--cream,#F4ECDD);border:1px solid var(--line2,rgba(244,236,221,.2));font-weight:600;letter-spacing:.02em;padding:9px 14px;border-radius:9px;font-size:13px;transition:.15s;margin-right:8px}
#fullprev:hover:not(:disabled){border-color:var(--aiko-line,rgba(237,28,36,.42))}
#fullprev:disabled{opacity:.5;cursor:default}
#pstage{position:relative;display:inline-block;line-height:0;max-width:100%}
#hitlayer{position:absolute;inset:0;pointer-events:none;z-index:1}
.hitbox{position:absolute;pointer-events:auto;cursor:pointer;border-radius:4px;transition:background .12s,box-shadow .12s}
.hitbox:hover{background:var(--aiko-soft);box-shadow:inset 0 0 0 1.5px var(--aiko-line)}
.hitbox.sel{background:var(--aiko-soft);box-shadow:inset 0 0 0 1.5px var(--aiko-line)}
.card.flash{animation:cardflash 1.15s ease-out}
@keyframes cardflash{0%,100%{box-shadow:0 0 0 0 transparent}18%{box-shadow:0 0 0 2px var(--aiko)}}
.secpanel{margin-bottom:18px}
.seccard{padding:13px 14px}
.sectitle{font-family:var(--mono);font-size:11px;letter-spacing:.09em;color:var(--aiko);font-weight:500;margin-bottom:9px}
.secrow{margin-bottom:9px}
.secrow:last-child{margin-bottom:0}
.seclbl{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.secinp{width:100%;background:#100E09;border:1px solid var(--line2);border-radius:7px;color:var(--cream);font-family:var(--mono);font-size:13.5px;padding:8px 10px;outline:none}
.secinp:focus{border-color:var(--aiko-line)}
/* a category name / decorative label containing a glyph its subset font cannot print */
.secinp.badglyph{border-color:#E03A2E;background:rgba(224,58,46,.10)}
.secinp.script{color:#E7B84F;font-style:italic}
#export{background:var(--aiko);color:#1a1400;font-weight:700;letter-spacing:.03em;padding:9px 16px;border-radius:9px;font-size:13px;transition:.15s}
#export:hover{filter:brightness(1.07);transform:translateY(-1px)}
#export:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
#publish{background:var(--ok);color:#0d2013;font-weight:700;letter-spacing:.03em;padding:9px 16px;border-radius:9px;font-size:13px;transition:.15s}
#publish:hover{filter:brightness(1.07);transform:translateY(-1px)}
#publish:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.prevtoggle{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--cream-dim);border:1px solid var(--line2);border-radius:9px;padding:8px 13px}
.prevtoggle:hover{border-color:var(--aiko-line);color:var(--cream)}

/* ---- layout ---- */
main.app{display:grid;grid-template-columns:210px 1fr minmax(400px,560px);height:calc(100dvh - 55px)}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.rail .tabs{display:flex;gap:4px;background:#100E09;border:1px solid var(--line2);border-radius:9px;padding:3px;margin-bottom:12px}
.rail .tabs button{flex:1;font-size:12px;color:var(--muted);padding:6px 8px;border-radius:6px;transition:.13s}
.rail .tabs button.on{background:var(--aiko-soft);color:var(--cream)}
.rail .lbl2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:2px 10px 8px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;color:var(--cream-dim);font-size:12.5px;letter-spacing:.02em;transition:.13s;position:relative}
.sec:hover{background:rgba(255,255,255,.035);color:var(--cream)}
.sec.on{background:var(--aiko-soft);color:var(--cream)}
.sec.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:2px;background:var(--aiko)}
.sec .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:#0d0b07;border:1px solid var(--line);border-radius:20px;padding:1px 8px;min-width:24px;text-align:center}
.sec.on .ct{color:var(--aiko);border-color:var(--aiko-line)}

#editor{overflow-y:auto;padding:20px 24px 70px}
.grouphd{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:14px 2px 8px;scroll-margin-top:14px}
.grouphd.sechd{font-family:var(--serif);font-size:22px;letter-spacing:.2px;text-transform:none;color:var(--cream);border-top:1px solid var(--line);margin-top:10px;padding-top:20px;display:flex;align-items:baseline;gap:10px}
.grouphd.sechd .n{font-size:12px;font-family:var(--mono);color:var(--muted);letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:11px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line2)}
.card:focus-within{border-color:var(--aiko-line);box-shadow:0 0 0 1px var(--aiko-line)}
.card.haswarn{border-color:rgba(224,145,43,.5)}
.nrow{display:flex;align-items:flex-start;gap:12px}
.name{flex:1;min-width:0;font-family:var(--mono);font-weight:500;font-size:16px;letter-spacing:.4px;color:var(--cream);text-transform:uppercase;outline:none;border-radius:5px;padding:3px 5px;margin:-3px -5px}
.name:focus{background:rgba(233,184,51,.09);box-shadow:inset 0 0 0 1px var(--aiko-line)}
.prices{display:flex;gap:6px;flex:none}
.pwrap{display:flex;align-items:center}
.price{width:66px;background:#100E09;border:1px solid var(--line2);border-radius:7px;color:var(--cream);font-family:var(--mono);font-size:15px;font-weight:500;text-align:right;padding:6px 9px;outline:none;font-variant-numeric:tabular-nums}
.price:focus{border-color:var(--aiko-line)}
.price.err{border-color:var(--bad);background:#fff6f6;color:#1a1400}
.rm{flex:none;width:30px;height:30px;border-radius:7px;color:var(--muted);display:grid;place-items:center;font-size:15px;transition:.13s}
.rm:hover{color:var(--bad);background:rgba(229,103,94,.1)}
.desc{font-size:12.5px;color:var(--cream-dim);margin-top:8px;outline:none;border-radius:5px;padding:4px 6px;margin-left:-6px;margin-right:-6px;line-height:1.5;max-width:58ch}
.desc:focus{background:rgba(233,184,51,.07);box-shadow:inset 0 0 0 1px var(--aiko-line)}
.metarow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.lbl{font-size:10.5px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}
.ctr{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctr.over{color:var(--bad)}
.afchk{display:inline-flex;gap:8px!important;flex-wrap:wrap;margin-top:0!important}
.afchk label{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);font-size:11.5px;letter-spacing:.02em;background:#100E09;cursor:pointer;transition:.13s;user-select:none}
.afchk label:hover{color:var(--cream-dim);border-color:var(--line2)}
.afchk label:has(input:checked){background:var(--aiko-soft);border-color:var(--aiko-line);color:var(--cream)}
.afchk label:has(input:checked) svg{color:var(--aiko)}
.afchk input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.afchk label svg{width:15px;height:15px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--warn);margin-top:8px;min-height:0}
.hint:empty{display:none}
.rmstrip{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px dashed var(--line2);border-radius:10px;margin-bottom:11px;color:var(--muted);font-size:13px}
.rmname{color:var(--cream-dim);text-transform:uppercase;letter-spacing:.4px}
.rmtag{font-size:10.5px;color:var(--bad);border:1px solid rgba(229,103,94,.4);border-radius:20px;padding:1px 8px;letter-spacing:.08em;text-transform:uppercase}
.restore{margin-left:auto;color:var(--aiko);font-size:12px;padding:5px 12px;border:1px solid var(--aiko-line);border-radius:7px;transition:.13s}
.restore:hover{background:var(--aiko-soft)}
.sp{text-decoration:underline wavy rgba(229,103,94,.9);text-underline-offset:3px;cursor:pointer}
.gl{color:var(--bad);text-decoration:underline}
.addzone{margin-top:4px}
.addlink,.addopen{width:100%;padding:12px;border:1.5px dashed var(--line2);border-radius:11px;color:var(--muted);font-size:13px;letter-spacing:.03em;transition:.13s;text-align:center}
.addlink:hover,.addopen:hover{border-color:var(--aiko-line);color:var(--aiko);background:var(--aiko-soft)}
.addform{background:var(--card2);border:1px solid var(--aiko-line);border-radius:12px;padding:14px;margin-top:8px;display:none;flex-direction:column;gap:10px}
.addform.open{display:flex}
.addform input,.addform textarea,.addform select{background:#100E09;border:1px solid var(--line2);border-radius:8px;color:var(--cream);font-family:var(--mono);font-size:13px;padding:8px 10px;outline:none}
.addform input:focus,.addform textarea:focus,.addform select:focus{border-color:var(--aiko-line)}
.addform .af-name{font-weight:700;text-transform:uppercase}
.af-nmeta,.af-dmeta{font-size:11px;color:var(--muted)}
.af-nmeta.bad,.af-dmeta.bad{color:var(--bad)}
.afadd{background:var(--aiko);color:#1a1400;font-weight:700;border-radius:8px;padding:9px;transition:.15s}
.afadd:disabled{opacity:.4;cursor:not-allowed}
.afcancel{color:var(--muted);font-size:12px;padding:8px}
.afchk.af-a-row{gap:8px}
.osel,.af-sec{cursor:pointer}

/* ---- preview ---- */
#previewPane{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;position:relative}
.plabel{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#ptag{color:var(--cream-dim);letter-spacing:.04em;text-transform:none}
#wrap{flex:1;overflow:auto;background:#2a2620;padding:16px;display:flex;justify-content:center;align-items:flex-start;position:relative}
#preview{max-width:100%;height:auto;border-radius:5px;box-shadow:0 20px 50px rgba(0,0,0,.6);background:#fff}
#busy{position:absolute;top:22px;right:22px;background:rgba(16,14,9,.9);color:var(--cream-dim);font-size:11px;padding:5px 10px;border-radius:20px;display:none}
#busy.on{display:block}
.prev-close{display:none;position:absolute;top:11px;right:14px;width:28px;height:28px;border-radius:7px;color:var(--muted);place-items:center;font-size:16px;z-index:2}
.prev-close:hover{color:var(--cream);background:rgba(255,255,255,.06)}

/* ---- popover (spell) ---- */
#popover{position:absolute;display:none;z-index:80;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);min-width:160px}
#popover .word{font-size:11px;color:var(--muted);padding:4px 8px}
#popover button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--cream);font-size:13px}
#popover button:hover{background:var(--aiko-soft)}
#popover .ignore{color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}

/* ---- Chucky + celebrate (restyled, engine drives them) ---- */
#chuckysay{position:fixed;left:16px;bottom:16px;z-index:60;max-width:300px;background:#100E09;color:var(--cream-dim);font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.4;padding:11px 14px;border-radius:13px;border-bottom-left-radius:3px;border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.4);display:none}
#chuckysay.on{display:block;animation:sayin .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes sayin{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
#celebrate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,8,4,.6);backdrop-filter:blur(3px)}
#celebrate.on{display:flex}
#celebrate .cbcard{background:var(--panel);border:1px solid var(--aiko-line);border-radius:20px;padding:30px 44px 34px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;animation:pop .45s cubic-bezier(.18,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1) rotate(0);opacity:1}}
#celebrate .cbcat{width:120px;height:120px;color:var(--aiko)}
#celebrate .cbcat svg{width:100%;height:100%}
#celebrate .cbline{font-family:var(--mono);font-weight:500;font-size:26px;color:var(--cream);letter-spacing:.5px}
#celebrate .cbsub{font-size:12px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(8,6,3,.55);z-index:44;display:none}
.scrim.on{display:block}

@media(max-width:1120px){ main.app{grid-template-columns:190px 1fr minmax(340px,430px)} }
/* Tablet: rail moves to a top strip; editor + preview stay side-by-side ON the page. */
@media(max-width:980px){
  main.app{grid-template-columns:1fr minmax(300px,400px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"rail rail" "editor preview"}
  .rail{grid-area:rail;flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:9px 12px;gap:6px}
  .rail .tabs{margin-bottom:0;flex:none}
  .rail .lbl2{display:none}
  .sec{width:auto;flex:none;white-space:nowrap;padding:7px 12px}
  .sec.on::before{display:none}
  #editor{grid-area:editor}
  #previewPane{grid-area:preview}
  .prevtoggle,.prev-close{display:none!important}
  .search{max-width:190px}
}
/* Phone: stack — preview sits directly below the editor on the same scrolling page. */
@media(max-width:640px){
  html,body{height:auto} body{overflow:auto}
  main.app{display:flex;flex-direction:column;height:auto}
  #editor{overflow:visible;height:auto;padding-bottom:20px}
  #previewPane{border-top:1px solid var(--line);height:auto}
  #wrap{height:70vh}
  .brand .tag{display:none}.search{max-width:150px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.movebtns{display:flex;flex-direction:column;gap:2px;margin-right:8px;flex:none}
.mvb{width:20px;height:15px;line-height:1;padding:0;border-radius:4px;cursor:pointer;
  background:transparent;border:1px solid var(--line,rgba(255,255,255,.14));color:var(--muted,#8F8676);font-size:10px}

<body>
<div id="boot">
  <div style="font-family:var(--serif);font-size:34px;letter-spacing:.2em;color:var(--aiko)">BESHAK</div>

</div>

</header>

    <div class="tabs"><button data-pg="0" class="on">Page 1</button><button data-pg="1">Page 2</button></div>

    <div class="plabel">Live preview <span id="ptag">— Page 1</span>
      <button class="prev-close" onclick="togglePrev(false)" style="margin-left:auto" aria-label="Close">✕</button></div>
    <div id="wrap"><canvas id="preview"></canvas><div id="busy">updating…</div></div>
  </aside>
</main>
<div class="scrim" id="scrim" onclick="closeDrawers()"></div>
<div id="popover"></div>
<script>
// ===================== BESHAK — byte-level menu engine =====================
// Loads the real designed PDF, splices new text/markers into its content streams, and re-saves.
// Nothing here re-typesets the menu: an untouched session exports bytes identical to the source.
//
// Three things make Beshak different from the other brands, and they shape the whole file:
//  * Editable bytes live in Form XObjects, not page content streams, so pristine bytes are kept
//    per STREAM (`PRISTINE[id]`) and every field says which stream its spans index.
//  * Text is Identity-H — each glyph is a 2-byte CID inside its own tiny string in a kerned TJ
//    array — so writing text means re-encoding through the font's unicode->CID table.
//  * On page 2 the dairy/gluten/sesame markers are baked into the background raster. Removing one
//    means painting its (pure white) box out; anything still wanted is re-stamped as a vector.

const { PDFDocument, PDFName, PDFNumber, PDFRawStream, PDFRef } = PDFLib;

let FM = null;                 // fieldmap.json
let pdfDoc = null;             // pdf-lib document
let pdfBytesOrig = null;       // the pristine file, for version fingerprinting
const PRISTINE = {};           // streamId -> original bytes as a latin1 string
const STREAM_REF = {};         // streamId -> PDFRef
const STREAM_DICT = {};        // streamId -> PDFDict

// ---- edit state (this, and only this, is what Publish and edit-memory persist) ----
const edits = {};              // fieldId -> new text
let removed = [];              // name-field ids that are hidden
let added = [];                // {col, name, desc, price, gram, markers}
let markerEdits = {};          // name-field id -> array of marker types

const ART = 10;                // artwork units per point (the page draws its XObject at 0.1)
const byId = {};               // fieldId -> field
const kidsOf = {};             // name id -> {desc, price, gram}

// ============================================================ small utilities
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = (v) => Math.round(v * 100) / 100;

/** Escape raw bytes (held as latin1 chars) into a PDF literal string body. */
function escPdf(bytes) {
  let out = '';
  for (let i = 0; i < bytes.length; i++) {
    const ch = bytes[i], c = bytes.charCodeAt(i);
    if (ch === '(' || ch === ')' || ch === '\\') out += '\\' + ch;
    else if (c === 13) out += '\\r';
    else if (c === 10) out += '\\n';
    else if (c < 32 || c === 127) out += '\\' + c.toString(8).padStart(3, '0');
    else out += ch;
  }
  return out;
}

/**
 * Apply byte-span replacements to a stream. Ops are applied right-to-left so earlier spans keep
 * their offsets; overlapping ops are dropped rather than silently corrupting the stream.
 */
function applyOps(text, ops) {
  const sorted = ops.slice().sort((a, b) => b.s - a.s);
  let out = text, guard = Infinity;
  for (const o of sorted) {
    if (o.e > guard) continue;
    out = out.slice(0, o.s) + o.t + out.slice(o.e);
    guard = o.s;
  }
  return out;
}

// ---- font access -------------------------------------------------------------
const famOf = (f) => FM.res_to_family[f.page + f.font];
const familyOf = (f) => FM.families[famOf(f)];

/** Text -> CIDs, or null if the menu's font has no glyph for some character. */
function toCids(text, fam) {
  const F = FM.families[fam];
  const out = [];
  for (const ch of text) {
    const c = F.uni2cid[ch];
    if (c === undefined) return null;
    out.push(c);
  }
  return out;
}
/** Characters this font cannot set — surfaced in the UI rather than silently dropped. */
function missingChars(text, fam) {
  const F = FM.families[fam];
  const bad = [];
  for (const ch of text) if (F.uni2cid[ch] === undefined && !bad.includes(ch)) bad.push(ch);
  return bad;
}

/** One show-op: every glyph its own string, separated by the field's baked tracking. */
function showOp(cids, kern) {
  if (!cids || !cids.length) return '';
  const parts = cids.map((c) => '(' + escPdf(String.fromCharCode(c >> 8) + String.fromCharCode(c & 255)) + ')');
  return '[' + parts.join(String(kern || 0)) + ']TJ';
}

function textWidth(text, fam, size, kern) {
  const F = FM.families[fam];
  let w = 0, n = 0;
  for (const ch of text) {
    const c = F.uni2cid[ch];
    w += (c !== undefined && F.widths[c] !== undefined) ? F.widths[c] : 500;
    n++;
  }
  // TJ kerns tighten the run by kern/1000 em per gap
  return (w / 1000) * size - Math.max(0, n - 1) * ((kern || 0) / 1000) * size;
}

/** Greedy word wrap to a pixel width, capped at maxLines (the last line keeps the overflow). */
function wrapText(text, fam, size, width, maxLines, kern) {
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const next = cur ? cur + ' ' + w : w;
    if (cur && textWidth(next, fam, size, kern) > width) { lines.push(cur); cur = w; }
    else cur = next;
    if (lines.length >= maxLines) break;
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  return lines;
}

const maxCharsFor = (width, size, role) => Math.max(4, Math.floor(width / (size * (FM.adv[role] || 0.5))));

// ============================================================ geometry helpers
const colOf = (nameField) => FM.columns.find((c) => c.id === nameField.col);

/** Live x where a name ends, honouring an edit that made it longer or shorter. */
function nameRight(f) {
  const t = edits[f.id] !== undefined ? edits[f.id] : f.display;
  return r2(f.x + textWidth(t, famOf(f), f.size, f.kern));
}

/**
 * How far the trailing cluster (gm label + markers) has to slide because the name changed
 * length. The designer set the GAP between the name and that cluster, so keeping the gap — not
 * the absolute position — is what stops a longer name from running into its own icons.
 *
 * This measures the edit against the baked text with the SAME width function, rather than
 * against the stored `right`: a name split into several show-ops does not measure identically
 * either way, and an unedited dish must come out at exactly zero or its markers would be
 * needlessly re-stamped and the export would stop being byte-identical.
 */
function clusterShift(f) {
  if (edits[f.id] === undefined) return 0;
  const fam = famOf(f);
  return r2(textWidth(edits[f.id], fam, f.size, f.kern) - textWidth(f.display, fam, f.size, f.kern));
}

/** Marker slots for a dish, left to right, after any name-length change and reflow. */
function markerSlots(f, types, dx, dy) {
  const k = kidsOf[f.id] || {};
  const baked = (f.marker_boxes || []);
  let x;
  if (baked.length) x = baked[0].x + dx;
  else if (k.gram && k.gram.bbox[0] > f.x) x = k.gram.bbox[2] + dx + FM.marker_gap;
  else x = nameRight(f) + FM.marker_gap;
  const out = [];
  for (const t of FM.marker_order) {
    if (!types.includes(t)) continue;
    const ic = FM.icons[t];
    out.push({ type: t, x: r2(x), y: r2(f.y + (FM.marker_dy[t] || -1) + dy) });
    x += ic.w / ART + FM.marker_gap;
  }
  return out;
}

/** PDF ops that paint one marker at a point, in artwork units. */
function stampMarker(type, x, y) {
  const ic = FM.icons[type];
  const sc = ic.scale && ic.scale !== 1 ? ` ${ic.scale} 0 0 ${ic.scale} 0 0 cm` : '';
  return `q 1 0 0 1 ${r2(x * ART)} ${r2(y * ART)} cm${sc} ${FM.brand_k}\n${ic.body}\nf Q\n`;
}

/**
 * Paint out a box in paper white. This is how a marker that is part of page 2's background
 * raster gets removed — the artwork behind every marker slot is flat white, so a filled box is
 * invisible. `0 0 0 0 k` keeps the file in the CMYK space the rest of the artwork uses.
 */
function patchBox(b, bleed) {
  const m = bleed === undefined ? 0.45 : bleed;
  return `q 0 0 0 0 k ${r2((b.x - m) * ART)} ${r2((b.y - m) * ART)} ${r2((b.w + 2 * m) * ART)} ${r2((b.h + 2 * m) * ART)} re f Q\n`;
}

// ============================================================ regenerate
/**
 * Rebuild the PDF from the pristine bytes plus the current edit state.
 * With no edits every stream is written back unchanged, so the export is byte-identical.
 */
async function regenerate() {
  const ops = {};                       // streamId -> [{s,e,t}]
  const tail = {};                      // streamId -> appended ops (stamps, patches, new text)
  const push = (sid, s, e, t) => { (ops[sid] = ops[sid] || []).push({ s, e, t }); };
  const append = (sid, t) => { tail[sid] = (tail[sid] || '') + t; };

  // ---- reflow: everything below a removed dish rides up by that dish's slot ----
  const shift = {};
  for (const c of FM.columns) {
    let dy = 0;
    for (const id of c.ids) {
      if (removed.includes(id)) { dy += byId[id].slot || c.pitch; continue; }
      shift[id] = dy;
    }
  }

  for (const f of FM.fields) {
    if (f.role !== 'name') continue;
    const gone = removed.includes(f.id);
    // PDF y grows upward, so riding up into a removed dish's slot means ADDING its height
    const dy = gone ? 0 : (shift[f.id] || 0);
    const k = kidsOf[f.id] || {};
    const dx = gone ? 0 : clusterShift(f);

    // -------- text --------
    for (const fld of [f, k.desc, k.price, k.gram].filter(Boolean)) {
      if (gone) {                                   // hide: drop every show-op it owns
        if (fld.role === 'gram') { if (fld.do_span) push(f.stream, fld.do_span[0], fld.do_span[1], ''); continue; }
        for (const o of fld.ops || []) push(fld.stream, o.span[0], o.span[1], '');
        for (const L of fld.lines || []) for (const o of L.ops) push(fld.stream, o.span[0], o.span[1], '');
        continue;
      }
      writeField(fld, f, dx, dy, push, append);
    }

    // -------- markers --------
    const want = gone ? [] : (markerEdits[f.id] || f.markers || []);
    const baked = f.marker_boxes || [];
    const bakedTypes = baked.map((m) => m.type);
    const moved = dx !== 0 || dy !== 0;
    const changed = moved || want.length !== bakedTypes.length || want.some((t) => !bakedTypes.includes(t));
    if (!changed) continue;                          // untouched dish: leave its bytes alone

    for (const m of baked) {
      if (m.span) push(f.stream, m.span[0], m.span[1], '');   // a vector marker: delete it
      else append(f.stream, patchBox(m));                     // baked into the raster: paint it out
    }
    for (const s of markerSlots(f, want, dx, dy)) append(f.stream, stampMarker(s.type, s.x, s.y));
  }

  // ---- added dishes ----
  for (const a of added) {
    const c = FM.columns.find((x) => x.id === a.col);
    if (!c) continue;
    append('p' + c.page, addedDishOps(a, c));
  }

  // ---- write every stream back ----
  for (const sid of Object.keys(PRISTINE)) {
    let text = PRISTINE[sid];
    if (ops[sid] && ops[sid].length) text = applyOps(text, ops[sid]);
    if (tail[sid]) text = text + '\n' + tail[sid];
    setStream(sid, text);
  }
  return pdfDoc.save({ useObjectStreams: false });
}

/** Write one field's current text back into its baked spans (and move it if reflow says so). */
function writeField(fld, name, dx, dy, push, append) {
  const fam = famOf(fld);
  const val = edits[fld.id] !== undefined ? edits[fld.id] : null;

  // reflow / cluster movement: rewrite the Tm origin of every block the field occupies
  if (dy !== 0 || (dx !== 0 && (fld.role === 'gram'))) {
    if (fld.role === 'gram') {
      // a label XObject is placed by its own BBox, so it can only be moved at the call site
      if (fld.do_span) {
        const inner = PRISTINE[name.stream].slice(fld.do_span[0], fld.do_span[1]);
        push(name.stream, fld.do_span[0], fld.do_span[1],
          `q 1 0 0 1 ${r2(dx * ART)} ${r2(dy * ART)} cm ${inner} Q`);
      }
    } else {
      for (const b of fld.blocks || []) {
        const tm = b.tm.slice();
        push(fld.stream, b.tm_span[0], b.tm_span[1], `${tm[0]} ${tm[1]} ${tm[2]} ${tm[3]} ${r2(tm[4])} ${r2(tm[5] + dy)}`);
      }
    }
  }

  if (val === null) return;                          // not edited: leave the baked glyphs alone

  if (fld.role === 'desc') {
    const c = colOf(name) || { width: 240 };
    const lines = wrapText(val, fam, fld.size, c.width, fld.lines.length + extraLines(name, fld), fld.kern);
    fld.lines.forEach((L, i) => {
      const text = lines[i] || '';
      const cids = text ? toCids(text, fam) : [];
      L.ops.forEach((o, j) => push(fld.stream, o.span[0], o.span[1], j === 0 ? showOp(cids, fld.kern) : ''));
    });
    // any line the baked text did not have gets appended as its own text block
    for (let i = fld.lines.length; i < lines.length; i++) {
      const cids = toCids(lines[i], fam);
      if (!cids) continue;
      const y = fld.lines[fld.lines.length - 1].y + dy - fld.pitch * (i - fld.lines.length + 1);
      append(fld.stream, textBlock(fld.font, fld.size, fld.x + 0, y, showOp(cids, fld.kern)));
    }
    return;
  }

  const cids = toCids(val, fam);
  if (!cids) return;                                 // unprintable character: keep what was there
  (fld.ops || []).forEach((o, i) => push(fld.stream, o.span[0], o.span[1], i === 0 ? showOp(cids, fld.kern) : ''));
}

/** How many extra description lines will fit before running into the dish below. */
function extraLines(name, desc) {
  const c = colOf(name);
  if (!c) return 0;
  const i = c.ids.indexOf(name.id);
  const next = i >= 0 && i + 1 < c.ids.length ? byId[c.ids[i + 1]] : null;
  const bottom = desc.lines[desc.lines.length - 1].y;
  const floor = next ? next.y + 12 : 30;
  return Math.max(0, Math.floor((bottom - floor) / desc.pitch));
}

/** An absolute text block in the artwork's coordinate space. */
function textBlock(fontRes, size, x, y, show) {
  return `q\n10 0 0 10 0 0 cm BT\n${fontRes} ${size} Tf\n1 0 0 1 ${r2(x)} ${r2(y)} Tm\n${show}\nET\nQ\n`;
}

/** Ops for a dish the user added at the bottom of a column. */
function addedDishOps(a, c) {
  const last = byId[c.ids[c.ids.length - 1]];
  const liveIds = c.ids.filter((id) => !removed.includes(id));
  const bottomId = liveIds.length ? liveIds[liveIds.length - 1] : null;
  const bottom = bottomId ? byId[bottomId] : last;
  const bDesc = (kidsOf[bottom.id] || {}).desc;
  const dy = -(bottom.slot || c.pitch) * (a.index || 1);
  const y = r2(bottom.y + dy);
  const fam = { name: FM.res_to_family[c.page + last.font], desc: bDesc ? famOf(bDesc) : FM.families.desc };
  let out = '';

  const nCids = toCids(a.name || '', fam.name);
  if (nCids) out += textBlock(last.font, last.size, c.x, y, showOp(nCids, last.kern));

  const price = (kidsOf[bottom.id] || {}).price;
  if (a.price && price) {
    const pc = toCids(String(a.price), famOf(price));
    if (pc) out += textBlock(price.font, price.size, price.x, y + (price.y - bottom.y), showOp(pc, price.kern));
  }
  if (a.desc && bDesc) {
    const lines = wrapText(a.desc, famOf(bDesc), bDesc.size, c.width, 4, bDesc.kern);
    lines.forEach((t, i) => {
      const cs = toCids(t, famOf(bDesc));
      if (cs) out += textBlock(bDesc.font, bDesc.size, c.x, y - (bottom.y - bDesc.y) - i * bDesc.pitch, showOp(cs, bDesc.kern));
    });
  }
  const gram = (kidsOf[bottom.id] || {}).gram;
  if (a.gram && gram) {
    const gc = toCids(String(a.gram), famOf(gram));
    const gx = c.x + textWidth(a.name || '', fam.name, last.size, last.kern) + FM.marker_gap;
    if (gc) out += textBlock(gram.font, gram.size, gx, y + (gram.y - bottom.y), showOp(gc, gram.kern));
  }
  let mx = c.x + textWidth(a.name || '', fam.name, last.size, last.kern) + FM.marker_gap
    + (a.gram ? textWidth(String(a.gram), fam.name, 8, 0) + FM.marker_gap : 0);
  for (const t of FM.marker_order) {
    if (!(a.markers || []).includes(t)) continue;
    out += stampMarker(t, mx, y + (FM.marker_dy[t] || -1));
    mx += FM.icons[t].w / ART + FM.marker_gap;
  }
  return out;
}

// ============================================================ stream plumbing
function setStream(sid, text) {
  const bytes = new Uint8Array(text.length);
  for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xff;
  const dict = STREAM_DICT[sid];
  dict.delete(PDFName.of('Filter'));
  dict.delete(PDFName.of('DecodeParms'));
  dict.set(PDFName.of('Length'), PDFNumber.of(bytes.length));
  pdfDoc.context.assign(STREAM_REF[sid], PDFRawStream.of(dict, bytes));
}

function loadStreams() {
  for (const [sid, info] of Object.entries(FM.streams)) {
    const [num, gen] = info.ref.split(' ').map(Number);
    const ref = PDFRef.of(num, gen);
    const obj = pdfDoc.context.lookup(ref);
    STREAM_REF[sid] = ref;
    STREAM_DICT[sid] = obj.dict;
    let s = '';
    const b = obj.contents;
    for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    PRISTINE[sid] = s;
  }
}

// Exported only when this file is required directly by a test; in the browser `module` is
// absent and the engine simply lives on the page.

// ===================== BESHAK — editor shell =====================
// Everything the person using the editor touches: the cards, the marker chips, add/remove,
// search + section rail, spell-check, live preview, Export and Publish. The byte engine above
// is untouched by any of it — this layer only ever changes `edits` / `removed` / `added` /
// `markerEdits` and then asks for a regenerate.

const MEM_BRAND = 'beshak';
let ready = false;
let activePage = 0;   // named to match the shared bug-reporter, which reads it
let previewTimer = null;
let pdfjsDoc = null;

const ALLERGEN_ICONS = {
  dairy: '<svg viewBox="0 0 12 22" aria-hidden="true"><path d="M3 6.5V3.2h6v3.3l1.6 2.4V20H1.4V8.9L3 6.5Z" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3.4" y="1" width="5.2" height="1.8" rx=".9" fill="currentColor"/></svg>',
  gluten: '<svg viewBox="0 0 12 22" aria-hidden="true"><path d="M6 21V8" stroke="currentColor" stroke-width="1.5"/><ellipse cx="6" cy="2.6" rx="1.6" ry="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 6.5 2 8.5v2l4-2 4 2v-2ZM6 10.5l-4 2v2l4-2 4 2v-2ZM6 14.5l-4 2v2l4-2 4 2v-2Z" fill="currentColor"/></svg>',
  sesame: '<svg viewBox="0 0 22 22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="5" cy="7" rx="2" ry="1.4" transform="rotate(-25 5 7)"/><ellipse cx="11" cy="4" rx="2" ry="1.4" transform="rotate(20 11 4)"/><ellipse cx="17" cy="8" rx="2" ry="1.4" transform="rotate(-15 17 8)"/><ellipse cx="7" cy="13" rx="2" ry="1.4" transform="rotate(15 7 13)"/><ellipse cx="13" cy="11" rx="2" ry="1.4" transform="rotate(-30 13 11)"/><ellipse cx="16" cy="16" rx="2" ry="1.4" transform="rotate(25 16 16)"/><ellipse cx="9" cy="18" rx="2" ry="1.4" transform="rotate(-20 9 18)"/></g></svg>',
  jain: '<svg viewBox="0 0 12 22" aria-hidden="true"><path d="M8.6 2v12.2a4.4 4.4 0 0 1-8.1 2.4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>',
};
const MARKER_LABEL = { dairy: 'Dairy', gluten: 'Gluten', sesame: 'Sesame', jain: 'Jain possible' };

// ============================================================ edit-state plumbing
const curText = (f) => (edits[f.id] !== undefined ? edits[f.id] : f.display);
const memBaseVer = () => 'v' + (pdfBytesOrig ? pdfBytesOrig.length : 0);

function memSnapshot() {
  return { edits: JSON.parse(JSON.stringify(edits)), removed: removed.slice(), added: JSON.parse(JSON.stringify(added)), markerEdits: JSON.parse(JSON.stringify(markerEdits)) };
}
function memApply(s) {
  for (const k of Object.keys(edits)) delete edits[k];
  Object.assign(edits, s.edits || {});
  removed = s.removed || [];
  added = s.added || [];
  markerEdits = s.markerEdits || {};
}
function memRebuild() { buildEditor(); schedulePreview(); }

// ============================================================ validation
/** Characters the menu's own fonts cannot set, plus a light spell check on edited text. */
let DICT = null;
const deacc = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
function wordAllowed(w) {
  if (!DICT) return true;
  const t = deacc(w).toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g, '');
  if (t.length < 3) return true;
  if (DICT.has(t)) return true;
  if (t.endsWith('s') && DICT.has(t.slice(0, -1))) return true;
  return t.split(/[-/]/).every((p) => p.length < 3 || DICT.has(p));
}
function typosIn(text) {
  return (String(text).match(/[A-Za-zÀ-ɏ'’-]+/g) || []).filter((w) => !wordAllowed(w));
}

function fieldIssues(f) {
  const val = curText(f);
  const role = f.role === 'gram' ? 'gram' : f.role;
  const bad = missingChars(val, famOf(f));
  const out = [];
  if (bad.length) out.push({ kind: 'char', msg: 'This menu’s font has no ' + bad.map((c) => (c === ' ' ? 'space' : '“' + c + '”')).join(', ') });
  if (role === 'price' && !/^\d+$/.test(val.trim())) out.push({ kind: 'char', msg: 'Prices are digits only' });
  if (edits[f.id] !== undefined && (role === 'name' || role === 'desc')) {
    const t = typosIn(val);
    if (t.length) out.push({ kind: 'spell', msg: 'Check spelling: ' + t.slice(0, 3).join(', ') });
  }
  return out;
}

/**
 * Issues on an added dish. These are checked separately because an added item is not an
 * FM.field — and without this an unavailable glyph would just make the new dish print nothing,
 * which is the silent-drop failure the other editors already gate against.
 */
function addedIssues(a) {
  const out = [];
  const check = (label, text, fam) => {
    const bad = missingChars(text || '', fam);
    if (bad.length) out.push({ kind: 'char', msg: label + ': this menu’s font has no ' + bad.map((c) => (c === ' ' ? 'space' : '“' + c + '”')).join(', ') });
  };
  check('Name', a.name, FM.res_to_family[nameFamKeyFor(a)]);
  check('Size', a.gram, FM.res_to_family[nameFamKeyFor(a)]);
  check('Price', a.price, FM.res_to_family[nameFamKeyFor(a)]);
  const dcol = FM.columns.find((c) => c.id === a.col);
  const dref = dcol && FM.fields.find((f) => f.role === 'desc' && f.of === dcol.ids[0]);
  if (dref) check('Description', a.desc, famOf(dref));
  if (a.price && !/^\d*$/.test(String(a.price).trim())) out.push({ kind: 'char', msg: 'Price: digits only' });
  if (!String(a.name || '').trim()) out.push({ kind: 'char', msg: 'Name: an added dish needs a name' });
  return out;
}
/** The display face used by a column, keyed the way res_to_family expects. */
function nameFamKeyFor(a) {
  const c = FM.columns.find((x) => x.id === a.col);
  const ref = c && byId[c.ids[c.ids.length - 1]];
  return ref ? ref.page + ref.font : 0 + '/R45';
}

function allIssues() {
  const out = [];
  for (const f of FM.fields) {
    if (f.role === 'name' && removed.includes(f.id)) continue;
    if (f.of && removed.includes(f.of)) continue;
    for (const i of fieldIssues(f)) out.push({ field: f, ...i });
  }
  for (const a of added) for (const i of addedIssues(a)) out.push({ added: a, ...i });
  return out;
}

function syncFlagPill() {
  const el = document.getElementById('flagpill');
  if (!el) return;
  const issues = allIssues();
  const blocking = issues.filter((i) => i.kind === 'char');
  if (blocking.length) { el.className = 'pill bad'; el.textContent = blocking.length + ' to fix'; }
  else if (issues.length) { el.className = 'pill warn'; el.textContent = '· ' + issues.length + ' to review'; }
  else { el.className = 'pill ok'; el.textContent = 'All clear'; }
  return blocking.length;
}

// ============================================================ the editor cards
function sectionsForPage(page) {
  const seen = [];
  for (const c of FM.columns) if (c.page === page && !seen.includes(c.section)) seen.push(c.section);
  return seen;
}

function dishesIn(page, section) {
  const ids = [];
  for (const c of FM.columns) if (c.page === page && c.section === section) ids.push(...c.ids);
  return ids.map((id) => byId[id]).sort((a, b) => (a.x - b.x) || (b.y - a.y));
}

function buildEditor() {
  const host = document.getElementById('editor');
  if (!host) return;
  host.innerHTML = '';
  for (const section of sectionsForPage(activePage)) {
    const dishes = dishesIn(activePage, section);
    const live = dishes.filter((d) => !removed.includes(d.id));
    const addedHere = added.filter((a) => (FM.columns.find((c) => c.id === a.col) || {}).section === section
      && (FM.columns.find((c) => c.id === a.col) || {}).page === activePage);
    const wrap = document.createElement('div');
    wrap.className = 'secgrp';
    wrap.innerHTML = `<h2 class="sechd" id="sec-${esc(section)}">${esc(section)}<span class="cnt">${live.length + addedHere.length}</span></h2>`;
    for (const d of dishes) wrap.appendChild(dishCard(d));
    for (const a of addedHere) wrap.appendChild(addedCard(a));
    const addBtn = document.createElement('button');
    addBtn.className = 'additem';
    addBtn.textContent = '+ Add item to ' + section;
    addBtn.onclick = () => openAdd(section);
    wrap.appendChild(addBtn);
    host.appendChild(wrap);
  }
  syncRail();
  syncFlagPill();
}

function fieldRow(f, label, opts) {
  const o = opts || {};
  const row = document.createElement('label');
  row.className = 'frow' + (o.wide ? ' wide' : '');
  const c = colOf(byId[f.of] || f) || { width: 240 };
  const width = f.role === 'name' ? Math.max(60, ((kidsOf[f.of] || {}).price ? 0 : 0) + c.width * 0.6) : c.width;
  const max = maxCharsFor(f.role === 'price' ? 40 : width, f.size, f.role === 'gram' ? 'gram' : f.role);
  const val = curText(f);
  row.innerHTML = `<span class="flbl">${esc(label)}</span>`;
  const input = document.createElement(o.area ? 'textarea' : 'input');
  input.value = val;
  input.maxLength = f.role === 'desc' ? max * (f.lines.length + 2) : max;
  input.dataset.fid = f.id;
  if (f.role === 'price') input.inputMode = 'numeric';
  input.oninput = () => {
    if (input.value === f.display) delete edits[f.id]; else edits[f.id] = input.value;
    markIssues(row, f);
    onChange();
  };
  row.appendChild(input);
  const note = document.createElement('span');
  note.className = 'fnote';
  row.appendChild(note);
  markIssues(row, f);
  return row;
}

function markIssues(row, f) {
  const note = row.querySelector('.fnote');
  const issues = fieldIssues(f);
  row.classList.toggle('bad', issues.some((i) => i.kind === 'char'));
  row.classList.toggle('warn', issues.length > 0 && !issues.some((i) => i.kind === 'char'));
  if (note) note.textContent = issues.length ? issues[0].msg : '';
}

function dishCard(d) {
  const card = document.createElement('article');
  card.className = 'card' + (removed.includes(d.id) ? ' gone' : '');
  card.dataset.name = (curText(d) + ' ' + ((kidsOf[d.id] || {}).desc ? curText(kidsOf[d.id].desc) : '')).toLowerCase();
  const k = kidsOf[d.id] || {};
  const head = document.createElement('div');
  head.className = 'chead';
  head.innerHTML = `<span class="cnum">${esc(d.section)}</span>`;
  const del = document.createElement('button');
  del.className = 'cdel';
  del.title = removed.includes(d.id) ? 'Put this item back' : 'Remove this item';
  del.textContent = removed.includes(d.id) ? '↺' : '✕';
  del.onclick = () => {
    if (removed.includes(d.id)) removed = removed.filter((x) => x !== d.id); else removed.push(d.id);
    buildEditor();
    onChange();
  };
  head.appendChild(del);
  card.appendChild(head);

  card.appendChild(fieldRow(d, 'Name'));
  if (k.gram) card.appendChild(fieldRow(k.gram, 'Size'));
  if (k.price) card.appendChild(fieldRow(k.price, 'Price'));
  if (k.desc) card.appendChild(fieldRow(k.desc, 'Description', { area: true, wide: true }));
  card.appendChild(markerChips(d));
  return card;
}

function markerChips(d) {
  const wrap = document.createElement('div');
  wrap.className = 'afchk';
  const cur = markerEdits[d.id] || d.markers || [];
  for (const t of FM.marker_order) {
    const on = cur.includes(t);
    const lab = document.createElement('label');
    lab.innerHTML = `<input type="checkbox"${on ? ' checked' : ''}><span class="mkico">${ALLERGEN_ICONS[t]}</span>${esc(MARKER_LABEL[t])}`;
    lab.querySelector('input').onchange = (e) => {
      const now = (markerEdits[d.id] || d.markers || []).slice();
      const i = now.indexOf(t);
      if (e.target.checked) { if (i < 0) now.push(t); } else if (i >= 0) now.splice(i, 1);
      markerEdits[d.id] = FM.marker_order.filter((x) => now.includes(x));
      onChange();
    };
    wrap.appendChild(lab);
  }
  return wrap;
}

function addedCard(a) {
  const card = document.createElement('article');
  card.className = 'card added';
  card.dataset.name = (a.name || '').toLowerCase();
  card.innerHTML = `<div class="chead"><span class="cnum">New item</span></div>`;
  const del = document.createElement('button');
  del.className = 'cdel';
  del.textContent = '✕';
  del.onclick = () => { added = added.filter((x) => x !== a); buildEditor(); onChange(); };
  card.querySelector('.chead').appendChild(del);
  const mk = (label, key, area) => {
    const row = document.createElement('label');
    row.className = 'frow' + (area ? ' wide' : '');
    row.innerHTML = `<span class="flbl">${esc(label)}</span>`;
    const inp = document.createElement(area ? 'textarea' : 'input');
    inp.value = a[key] || '';
    inp.oninput = () => { a[key] = inp.value; if (card._sync) card._sync(); onChange(); };
    row.appendChild(inp);
    return row;
  };
  card.appendChild(mk('Name', 'name'));
  card.appendChild(mk('Size', 'gram'));
  card.appendChild(mk('Price', 'price'));
  card.appendChild(mk('Description', 'desc', true));
  const note = document.createElement('div');
  note.className = 'addnote';
  card.appendChild(note);
  card._sync = () => {
    const iss = addedIssues(a);
    note.textContent = iss.length ? iss[0].msg : '';
    card.classList.toggle('bad', iss.length > 0);
  };
  card._sync();
  const chips = document.createElement('div');
  chips.className = 'afchk';
  for (const t of FM.marker_order) {
    const lab = document.createElement('label');
    lab.innerHTML = `<input type="checkbox"${(a.markers || []).includes(t) ? ' checked' : ''}><span class="mkico">${ALLERGEN_ICONS[t]}</span>${esc(MARKER_LABEL[t])}`;
    lab.querySelector('input').onchange = (e) => {
      a.markers = a.markers || [];
      if (e.target.checked) a.markers.push(t); else a.markers = a.markers.filter((x) => x !== t);
      a.markers = FM.marker_order.filter((x) => a.markers.includes(x));
      onChange();
    };
    chips.appendChild(lab);
  }
  card.appendChild(chips);
  return card;
}

function openAdd(section) {
  const cols = FM.columns.filter((c) => c.page === activePage && c.section === section);
  if (!cols.length) return;
  // put it in the column with the most room left below its last dish
  const col = cols.slice().sort((a, b) => b.bottom - a.bottom)[0];
  const n = added.filter((a) => a.col === col.id).length + 1;
  added.push({ col: col.id, index: n, name: 'New item', desc: '', price: '', gram: '', markers: [] });
  buildEditor();
  onChange();
}

// ============================================================ rail + search
function syncRail() {
  const rail = document.getElementById('rail');
  if (!rail) return;
  rail.querySelectorAll('.railsec').forEach((n) => n.remove());
  for (const s of sectionsForPage(activePage)) {
    const live = dishesIn(activePage, s).filter((d) => !removed.includes(d.id)).length
      + added.filter((a) => (FM.columns.find((c) => c.id === a.col) || {}).section === s).length;
    const b = document.createElement('button');
    b.className = 'railsec';
    b.innerHTML = `${esc(s)}<span class="cnt">${live}</span>`;
    b.onclick = () => { const el = document.getElementById('sec-' + s); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    rail.appendChild(b);
  }
  rail.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', +b.dataset.pg === activePage));
}

function filterItems(q) {
  const t = String(q || '').trim().toLowerCase();
  document.querySelectorAll('#editor .card').forEach((c) => {
    c.style.display = (!t || (c.dataset.name || '').includes(t)) ? '' : 'none';
  });
  document.querySelectorAll('#editor .secgrp').forEach((g) => {
    const any = [...g.querySelectorAll('.card')].some((c) => c.style.display !== 'none');
    g.style.display = (!t || any) ? '' : 'none';
  });
}

function togglePrev(on) {
  const p = document.getElementById('previewPane');
  if (!p) return;
  const want = on === undefined ? !p.classList.contains('open') : on;
  p.classList.toggle('open', want);
  document.getElementById('scrim').classList.toggle('on', want && window.innerWidth <= 640);
}
function closeDrawers() { togglePrev(false); document.getElementById('scrim').classList.remove('on'); }

// ============================================================ change plumbing
function onChange() {
  syncFlagPill();
  schedulePreview();
  if (ready) { try { MEM.tick(); } catch (_) { /* memory is best-effort */ } }
}

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => { renderPreview().catch(() => {}); }, 260);
}

// ============================================================ preview / export
async function renderPreview() {
  const canvas = document.getElementById('preview');
  if (!canvas || typeof pdfjsLib === 'undefined') return;
  const busy = document.getElementById('busy');
  if (busy) busy.style.display = '';
  try {
    const bytes = await regenerate();
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    pdfjsDoc = doc;
    const page = await doc.getPage(activePage + 1);
    const wrap = document.getElementById('wrap');
    const vw = Math.max(240, (wrap ? wrap.clientWidth : 480) - 8);
    const vp0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: vw / vp0.width });
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    const tag = document.getElementById('ptag');
    if (tag) tag.textContent = '— Page ' + (activePage + 1);
  } catch (e) {
    if (!/Cancelled/i.test(String(e && e.message))) throw e;
  } finally { if (busy) busy.style.display = 'none'; }
}

function download(bytes, name) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

async function doExport() {
  if (syncFlagPill()) { alert('Some text can’t be printed in this menu’s fonts — fix the highlighted fields first.'); return; }
  const bytes = await regenerate();
  download(bytes, 'Beshak_Menu.pdf');
  try { MEM.push('export'); } catch (_) { /* history is best-effort */ }
  celebrate();
}

// ============================================================ publish
// Unlike Export, which hands a PDF to whoever clicked it, Publish pushes the current edit state
// to the server so any device opening this editor afterwards starts from it. It ships the same
// JSON that drives regenerate() — the baseline PDF and fieldmap are never touched.
const PUBKEY = 'chucky_publish_key';
function askPublishKey(prev) {
  const k = prompt(prev ? 'That publish key was rejected. Try again:' : 'Publish key:', '');
  if (k) { try { localStorage.setItem(PUBKEY, k); } catch (_) { /* private mode */ } }
  return k;
}
async function doPublish() {
  const btn = document.getElementById('publish');
  if (!btn) return;
  if (syncFlagPill()) { alert('Some text can’t be printed in this menu’s fonts — fix the highlighted fields first.'); return; }
  if (!confirm('Publish this menu? Everyone who opens the Beshak editor will start from it.')) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Publishing…';
  let key = '';
  try { key = localStorage.getItem(PUBKEY) || ''; } catch (_) { key = ''; }
  if (!key) key = askPublishKey('');
  const send = () => fetch('/api/menu-state/' + MEM_BRAND + '?k=' + encodeURIComponent(key), {
    method: 'POST', body: JSON.stringify({ state: memSnapshot(), base: memBaseVer() }),
  });
  try {
    await regenerate();                 // refuse to publish a state that will not even export
    if (!key) { btn.disabled = false; btn.textContent = label; return; }
    let res = await send();
    if (res.status === 403) {
      key = askPublishKey(key);
      if (!key) { btn.disabled = false; btn.textContent = label; return; }
      res = await send();
    }
    if (!res.ok) alert('Could not publish (server said ' + res.status + ').');
    else { btn.textContent = 'Published ✓'; setTimeout(() => { btn.textContent = label; }, 1600); }
  } catch (e) {
    alert('Could not publish: ' + ((e && e.message) || e));
  } finally { btn.disabled = false; if (btn.textContent === 'Publishing…') btn.textContent = label; }
}

// ============================================================ export celebration
const CHUCKY_LINES = ['KILLED IT 😎', 'CHEF’S KISS 🤌', 'SERVED 🍽️', 'COOKED. LITERALLY.', 'MENU SLAPS.',
  'PLATED. 🐾', 'CERTIFIED BANGER.', 'ATE. NO CRUMBS.', 'HOT OUT THE OVEN.', 'THAT’S A WRAP.'];
let lineSeed = 0;
function celebrate() {
  const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
  const txt = CHUCKY_LINES[(day + lineSeed++) % CHUCKY_LINES.length];
  const ov = document.createElement('div');
  ov.id = 'celebrate';
  ov.innerHTML = '<div class="cbcard"><div class="cbmark">BESHAK</div><div class="cbline">' + esc(txt) + '</div></div>';
  document.body.appendChild(ov);
  setTimeout(() => ov.remove(), 1900);
}

// ============================================================ wiring
function wire() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('export', () => { doExport().catch((e) => alert('Export failed: ' + ((e && e.message) || e))); });
  on('publish', () => { doPublish(); });
  on('fullprev', async () => {
    const bytes = await regenerate();
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  });
  document.querySelectorAll('.rail .tabs button').forEach((b) => {
    b.onclick = () => { activePage = +b.dataset.pg; buildEditor(); schedulePreview(); };
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      const q = document.getElementById('q');
      if (q) q.focus();
    }
  });
  window.addEventListener('resize', () => { clearTimeout(previewTimer); previewTimer = setTimeout(() => renderPreview().catch(() => {}), 300); });
}

// ============================================================ boot
async function boot() {
  const msg = (t) => { const el = document.getElementById('bootmsg'); if (el) el.textContent = t; };
  msg('Reading the menu…');
  const v = '?v=' + Date.now();
  const [fmRes, pdfRes, baseRes, culRes] = await Promise.all([
    fetch('fieldmap.json' + v), fetch('beshak.pdf' + v), fetch('base_words.json' + v), fetch('culinary.json' + v),
  ]);
  FM = await fmRes.json();
  pdfBytesOrig = new Uint8Array(await pdfRes.arrayBuffer());
  try {
    const base = await baseRes.json(), cul = await culRes.json();
    DICT = new Set([].concat(base.words || base, cul.words || cul).map((w) => String(w).toLowerCase()));
    for (const f of FM.fields) for (const w of String(f.display || '').match(/[A-Za-z]+/g) || []) DICT.add(w.toLowerCase());
  } catch (_) { DICT = null; }

  for (const f of FM.fields) {
    byId[f.id] = f;
    if (f.of) { kidsOf[f.of] = kidsOf[f.of] || {}; kidsOf[f.of][f.role] = f; }
  }

  msg('Opening the artwork…');
  pdfDoc = await PDFDocument.load(pdfBytesOrig, { updateMetadata: false });
  loadStreams();

  msg('Checking for a published menu…');
  try {
    const r = await fetch('/api/menu-state/' + MEM_BRAND + v);
    if (r.ok) {
      const j = await r.json();
      if (j && j.state) memApply(j.state);
    }
  } catch (_) { /* offline or not deployed: fall back to the pristine menu */ }

  buildEditor();
  wire();
  try { MEM.init(); } catch (_) { /* memory is optional */ }
  const b = document.getElementById('boot');
  if (b) b.style.display = 'none';
  ready = true;
  renderPreview().catch(() => {});
}


// ============ EDIT MEMORY — autosave + resume + version history (per brand) ============
// Glue each editor must define BEFORE this block:
//   const MEM_BRAND = 'aiko-drinks';        // unique key
//   function memSnapshot(){ return {...}; }  // serialisable current edit state (order-stable)
//   function memApply(state){ ... }          // mutate editor vars from a saved state
//   function memRebuild(){ ... }             // rebuild UI + regenerate + render after apply
//   let   memBaseVer = '';                   // fingerprint of the base PDF (for #6 update detection)
const MEM = (function(){
  const K='chucky_mem_'+MEM_BRAND, AUTO=K+':auto', SNAPS=K+':snaps';
  let initial='', timer=null, statusEl=null, panel=null, ready=false;
  const J=o=>{ try{return JSON.stringify(o);}catch(_){return '';} };
  const P=s=>{ try{return JSON.parse(s);}catch(_){return null;} };
  function ago(t){ const s=Math.max(0,(Date.now()-t)/1000);
    if(s<45) return 'just now'; if(s<3600) return Math.round(s/60)+'m ago';
    if(s<86400) return Math.round(s/3600)+'h ago'; return Math.round(s/86400)+'d ago'; }
  const dirty=()=> J(memSnapshot())!==initial;
  function setStatus(txt,cls){ if(!statusEl)return; statusEl.querySelector('.memtxt').textContent=txt; statusEl.dataset.state=cls||''; statusEl.style.display=txt?'':'none'; }
  function tick(){
    if(!ready) return;
    clearTimeout(timer);
    if(!dirty()){ try{localStorage.removeItem(AUTO);}catch(_){}; setStatus('',''); return; }
    setStatus('Saving…','saving');
    timer=setTimeout(()=>{ try{ localStorage.setItem(AUTO, J({t:Date.now(), base:memBaseVer, s:memSnapshot()})); setStatus('Saved','ok'); }catch(_){ setStatus('',''); } }, 500);
  }
  function snapshot(label){ if(!dirty()) return; try{ const a=P(localStorage.getItem(SNAPS))||[];
    a.unshift({t:Date.now(), label:label||'edit', base:memBaseVer, s:memSnapshot()});
    localStorage.setItem(SNAPS, J(a.slice(0,12))); }catch(_){} }
  const snaps=()=> P(localStorage.getItem(SNAPS))||[];
  function restore(state){ try{ memApply(state); memRebuild(); }catch(e){ console.error('restore failed',e); } tick(); }
  // ---------- UI ----------
  function build(){
    if(document.getElementById('memwrap')) return;
    const css=document.createElement('style'); css.textContent=`
    #memwrap{position:fixed;left:16px;bottom:16px;z-index:60;font:12px/1.4 var(--mono,ui-monospace,monospace)}
    #memstat{display:none;align-items:center;gap:7px;background:rgba(20,18,12,.92);color:#CFC6B4;border:1px solid rgba(244,236,221,.16);
      border-radius:999px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(6px);user-select:none;box-shadow:0 10px 30px -14px #000}
    #memstat:hover{border-color:rgba(244,236,221,.34)}
    #memstat .dot{width:7px;height:7px;border-radius:50%;background:#8F8676;flex:none}
    #memstat[data-state=ok] .dot{background:#7BC96F} #memstat[data-state=saving] .dot{background:#E0A44A;animation:mempulse 1s infinite}
    @keyframes mempulse{50%{opacity:.35}}
    #mempanel{display:none;position:absolute;left:0;bottom:42px;width:280px;max-height:340px;overflow:auto;background:rgba(18,16,11,.98);
      border:1px solid rgba(244,236,221,.16);border-radius:12px;padding:10px;box-shadow:0 24px 60px -24px #000}
    #mempanel.on{display:block} #mempanel h4{margin:2px 4px 8px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8F8676;font-weight:600}
    .memrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;color:#CFC6B4}
    .memrow:hover{background:rgba(244,236,221,.07)} .memrow .ml{flex:1;min-width:0} .memrow .mt{font-size:10.5px;color:#8F8676}
    .memrow .mr{font-size:10px;color:#8F8676} .memrow.empty{color:#6f6858;cursor:default}
    #membar{position:fixed;left:0;right:0;top:0;z-index:70;display:none;align-items:center;justify-content:center;gap:14px;
      padding:10px 16px;background:linear-gradient(90deg,#2A1F12,#1c150c);border-bottom:1px solid rgba(224,164,74,.4);
      color:#F4ECDD;font:13px/1.4 var(--mono,ui-monospace,monospace);box-shadow:0 8px 24px -12px #000}
    #membar.on{display:flex} #membar b{color:#E0A44A}
    #membar button{font:inherit;font-size:12px;padding:5px 13px;border-radius:8px;cursor:pointer;border:1px solid rgba(244,236,221,.28);background:transparent;color:#F4ECDD}
    #membar button.pri{background:#E0A44A;border-color:#E0A44A;color:#1a1508;font-weight:600}
    #membar button:hover{filter:brightness(1.1)}
    @media(max-width:640px){#memwrap{left:10px;bottom:10px}#mempanel{width:min(280px,86vw)}}`;
    document.head.appendChild(css);
    const wrap=document.createElement('div'); wrap.id='memwrap';
    wrap.innerHTML='<div id="memstat" title="Edit memory — click for history"><span class="dot"></span><span class="memtxt"></span> · History</div><div id="mempanel"></div>';
    document.body.appendChild(wrap);
    const bar=document.createElement('div'); bar.id='membar'; document.body.appendChild(bar);
    statusEl=document.getElementById('memstat'); panel=document.getElementById('mempanel');
    statusEl.addEventListener('click',togglePanel);
    document.addEventListener('click',e=>{ if(panel&&!wrap.contains(e.target)) panel.classList.remove('on'); });
  }
  function togglePanel(e){ e&&e.stopPropagation(); if(!panel)return; const open=!panel.classList.contains('on'); if(open)renderPanel(); panel.classList.toggle('on',open); }
  function renderPanel(){
    const list=snaps(); let h='<h4>Version history</h4>';
    if(!list.length) h+='<div class="memrow empty">No saved versions yet.<br>Exports and edits are saved here.</div>';
    else list.forEach((v,i)=>{ h+='<div class="memrow" data-i="'+i+'"><span class="ml"><div>'+esc(v.label)+'</div><div class="mt">'+ago(v.t)+(v.base!==memBaseVer?' · older menu':'')+'</div></span><span class="mr">restore</span></div>'; });
    panel.innerHTML=h;
    panel.querySelectorAll('.memrow[data-i]').forEach(r=>r.addEventListener('click',()=>{ const v=snaps()[+r.dataset.i]; if(v){ snapshot('before restore'); restore(v.s); panel.classList.remove('on'); } }));
  }
  function esc(s){ return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function checkResume(){
    const a=P(localStorage.getItem(AUTO)); if(!a||!a.s||J(a.s)===initial) return;
    const bar=document.getElementById('membar'); if(!bar) return;
    const stale=a.base && memBaseVer && a.base!==memBaseVer;
    bar.innerHTML='<span>'+(stale?'You have edits from a <b>previous version</b> of this menu ('+ago(a.t)+').':'You left <b>unsaved edits</b> here '+ago(a.t)+'.')+'</span>'
      +'<button class="pri" id="memres">Resume them</button><button id="memfresh">Start fresh</button>';
    bar.classList.add('on');
    bar.querySelector('#memres').addEventListener('click',()=>{ restore(a.s); bar.classList.remove('on'); });
    bar.querySelector('#memfresh').addEventListener('click',()=>{ try{localStorage.removeItem(AUTO);}catch(_){}; bar.classList.remove('on'); tick(); });
  }
  function init(){ try{ initial=J(memSnapshot()); }catch(_){ initial=''; } ready=true; build(); checkResume(); }
  return { init, tick, snapshot, restore, ago };
})();


boot().catch(e => {
  console.error(e);
  const m = document.getElementById('bootmsg');
  if (m) m.textContent = 'Could not open the menu: ' + ((e && e.message) || e);
});
</script>
<script>

// ===== REPORT A BUG -> /api/bug (attaches a preview snapshot + current edit state) =====
(function(){
  if(document.getElementById('bugbtn')) return;
  const css=document.createElement('style'); css.textContent=`
  #bugbtn{position:fixed;right:16px;bottom:16px;z-index:62;background:rgba(20,18,12,.92);color:#CFC6B4;border:1px solid rgba(244,236,221,.16);border-radius:999px;padding:7px 13px;font:12px/1.4 ui-monospace,monospace;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 10px 30px -14px #000}
  #bugbtn:hover{border-color:rgba(240,97,107,.6);color:#F0616B}
  #bugmodal{position:fixed;inset:0;z-index:82;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
  #bugmodal.on{display:flex}
  #bugcard{width:min(460px,94vw);background:#17150f;border:1px solid rgba(244,236,221,.18);border-radius:14px;padding:18px;font-family:ui-monospace,monospace;color:#F4ECDD;box-shadow:0 30px 70px -24px #000}
  #bugcard h3{margin:0 0 4px;font-size:15px}#bugcard p{margin:0 0 12px;font-size:11.5px;color:#8F8676;line-height:1.5}
  #bugcard textarea{width:100%;min-height:92px;background:#0f0d08;border:1px solid rgba(244,236,221,.18);border-radius:9px;color:#F4ECDD;font:inherit;font-size:13px;padding:10px;resize:vertical;box-sizing:border-box}
  #bugcard .r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;align-items:center}
  #bugcard button{font:inherit;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;border:1px solid rgba(244,236,221,.28);background:transparent;color:#F4ECDD}
  #bugcard button.pri{background:#F0616B;border-color:#F0616B;color:#1a0c0d;font-weight:600}
  #bugshot{font-size:11px;color:#7BC96F;margin-top:8px;flex:1;text-align:left}`;
  document.head.appendChild(css);
  const btn=document.createElement('div'); btn.id='bugbtn'; btn.textContent='🐞 Report a bug'; document.body.appendChild(btn);
  const modal=document.createElement('div'); modal.id='bugmodal';
  modal.innerHTML='<div id="bugcard"><h3>Report a bug</h3><p>Describe what looks wrong. A snapshot of the current preview and your edits are attached, so it can be reproduced and fixed without you re-doing anything.</p><textarea id="bugdesc" placeholder="e.g. after removing a drink and adding one, the new drink overlaps the last line"></textarea><div class="r"><span id="bugshot"></span><button id="bugcancel">Cancel</button><button class="pri" id="bugsend">Send report</button></div></div>';
  document.body.appendChild(modal);
  const snap=()=>{ try{ const c=document.getElementById('preview'); if(c&&c.width) return c.toDataURL('image/jpeg',0.5); }catch(_){} return null; };
  btn.onclick=()=>{ modal.classList.add('on'); document.getElementById('bugshot').textContent = snap()?'✓ preview snapshot attached':''; document.getElementById('bugdesc').focus(); };
  const close=()=>modal.classList.remove('on');
  document.getElementById('bugcancel').onclick=close;
  modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
  document.getElementById('bugsend').onclick=async()=>{
    const desc=document.getElementById('bugdesc').value.trim(); if(!desc){ document.getElementById('bugdesc').focus(); return; }
    const sb=document.getElementById('bugsend'); sb.textContent='Sending…'; sb.disabled=true;
    let state=null; try{ if(typeof memSnapshot==='function') state=memSnapshot(); }catch(_){}
    const payload={ editor:(typeof MEM_BRAND!=='undefined'?MEM_BRAND:location.pathname), page:(typeof activePage!=='undefined'?activePage:null), desc, url:location.href, state, shot:snap() };
    try{ const r=await fetch('/api/bug',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}); const j=await r.json();
      if(j.ok){ sb.textContent='Sent ✓'; setTimeout(()=>{ close(); sb.textContent='Send report'; sb.disabled=false; document.getElementById('bugdesc').value=''; },1000); }
      else { sb.textContent='Failed'; sb.disabled=false; }
    }catch(e){ sb.textContent='Failed — offline?'; sb.disabled=false; }
  };
})();
