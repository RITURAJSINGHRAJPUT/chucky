<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiko · Menu Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ink:#0E0D0B;--panel:#161410;--card:#1E1B15;--card2:#242017;
  --cream:#F4ECDD;--cream-dim:#CFC6B4;--muted:#8F8676;
  --line:rgba(244,236,221,.10);--line2:rgba(244,236,221,.17);
  --red:#E9B833;--aiko:#E9B833;--aiko-soft:rgba(233,184,51,.13);--aiko-line:rgba(233,184,51,.42);
  --ok:#5FB07C;--warn:#E0912B;--bad:#E5675E;
  --paper:#F6EFE2;
  --serif:'Lora',Georgia,serif;--mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--mono);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--aiko);color:#1a1400}
#boot{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#boot svg{color:var(--aiko)!important;fill:var(--aiko)!important}
#boot .s{color:var(--muted);font-family:var(--mono);font-size:13px;letter-spacing:.4px}
.spin{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--aiko);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- top bar ---- */
header.bar{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141209,#100E09);position:relative;z-index:20}
.home{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--muted);border:1px solid var(--line2);font-size:15px;text-decoration:none}
.home:hover{color:var(--cream);border-color:var(--aiko-line)}
.brand{display:flex;align-items:center;gap:11px}
.brand .wm{height:30px;width:auto;color:var(--aiko)}
.brand .tag{font-size:10.5px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.homelink{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);margin-right:2px}
.homelink:hover{color:var(--cream)}
.homelink:hover .chucky{transform:translateY(-2px)}
.homelink .chucky{width:30px;height:30px;color:var(--aiko);transition:transform .2s}
.homelink .bhint{font-size:14px}
.homelink .ctag{display:none}
.search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:#100E09;border:1px solid var(--line2);border-radius:9px;padding:7px 11px;transition:.15s}
.search:focus-within{border-color:var(--aiko-line)}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.search input{flex:1;background:none;border:none;outline:none;color:var(--cream);font-family:var(--mono);font-size:13px}
.search input::placeholder{color:var(--muted)}
.search kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:#0d0b07}
.spacer{flex:1}
.pill{font-size:12px;font-weight:600;letter-spacing:.02em;padding:6px 12px;border-radius:999px;border:1px solid;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);border-color:rgba(95,176,124,.4);background:rgba(95,176,124,.08)}
.pill.bad{color:var(--bad);border-color:rgba(229,103,94,.45);background:rgba(229,103,94,.1)}
#persona{background:transparent;color:var(--cream,#F4ECDD);border:1px solid var(--line2,rgba(244,236,221,.2));font-weight:600;letter-spacing:.02em;padding:9px 14px;border-radius:9px;font-size:13px;transition:.15s;margin-right:8px}
#persona:hover,#persona.on{border-color:var(--aiko);color:var(--aiko)}
.persov{position:fixed;inset:0;background:rgba(6,5,3,.74);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:130;padding:20px}
.perscard{background:var(--panel,#17150f);border:1px solid var(--line2,rgba(244,236,221,.2));border-radius:16px;padding:20px;width:min(400px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pershd{font-size:14px;color:var(--cream,#F4ECDD);margin-bottom:16px;display:flex;flex-direction:column;gap:3px}
.pershd span{font-size:11px;color:var(--muted,#8F8676);font-weight:400}
.perslbl{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted,#8F8676);margin:12px 2px 6px}
.perssel,.persocc,.persguest{width:100%;box-sizing:border-box;background:#100e09;border:1px solid var(--line2,rgba(244,236,221,.2));border-radius:9px;color:var(--cream,#F4ECDD);font-family:var(--mono,ui-monospace,monospace);font-size:14px;padding:10px 12px;outline:none;margin-bottom:2px}
.persocc,.persguest{text-transform:uppercase;font-weight:700;letter-spacing:.4px;margin-top:8px}
.perssel:focus,.persocc:focus,.persguest:focus{border-color:var(--aiko)}
.persfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.cropbtn{font:inherit;font-size:12.5px;color:var(--cream-dim,#CFC6B4);background:transparent;border:1px solid var(--line2,rgba(244,236,221,.2));border-radius:8px;padding:9px 16px;cursor:pointer;transition:.13s}
.cropbtn:hover{border-color:var(--aiko);color:var(--cream,#F4ECDD)}
.cropbtn.save{background:var(--aiko);color:#1a1400;border-color:var(--aiko);font-weight:700}
.cropbtn.ghost{color:var(--muted,#8F8676)}
#export{background:var(--aiko);color:#1a1400;font-weight:700;letter-spacing:.03em;padding:9px 16px;border-radius:9px;font-size:13px;transition:.15s}
#export:hover{filter:brightness(1.07);transform:translateY(-1px)}
#export:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.prevtoggle{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--cream-dim);border:1px solid var(--line2);border-radius:9px;padding:8px 13px}
.prevtoggle:hover{border-color:var(--aiko-line);color:var(--cream)}

/* ---- layout ---- */
main.app{display:grid;grid-template-columns:210px 1fr minmax(400px,560px);height:calc(100dvh - 55px)}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.rail .tabs{display:flex;gap:4px;background:#100E09;border:1px solid var(--line2);border-radius:9px;padding:3px;margin-bottom:12px}
.rail .tabs button{flex:1;font-size:12px;color:var(--muted);padding:6px 8px;border-radius:6px;transition:.13s}
.rail .tabs button.on{background:var(--aiko-soft);color:var(--cream)}
.rail .lbl2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:2px 10px 8px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;color:var(--cream-dim);font-size:12.5px;letter-spacing:.02em;transition:.13s;position:relative}
.sec:hover{background:rgba(255,255,255,.035);color:var(--cream)}
.sec.on{background:var(--aiko-soft);color:var(--cream)}
.sec.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:2px;background:var(--aiko)}
.sec .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:#0d0b07;border:1px solid var(--line);border-radius:20px;padding:1px 8px;min-width:24px;text-align:center}
.sec.on .ct{color:var(--aiko);border-color:var(--aiko-line)}

#editor{overflow-y:auto;padding:20px 24px 70px}
.grouphd{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:14px 2px 8px;scroll-margin-top:14px}
.grouphd.sechd{font-family:var(--serif);font-size:22px;letter-spacing:.2px;text-transform:none;color:var(--cream);border-top:1px solid var(--line);margin-top:10px;padding-top:20px;display:flex;align-items:baseline;gap:10px}
.grouphd.sechd .n{font-size:12px;font-family:var(--mono);color:var(--muted);letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:11px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line2)}
.card:focus-within{border-color:var(--aiko-line);box-shadow:0 0 0 1px var(--aiko-line)}
.card.haswarn{border-color:rgba(224,145,43,.5)}
.nrow{display:flex;align-items:flex-start;gap:12px}
.name{flex:1;min-width:0;font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.4px;color:var(--cream);text-transform:uppercase;outline:none;border-radius:5px;padding:3px 5px;margin:-3px -5px}
.name:focus{background:rgba(233,184,51,.09);box-shadow:inset 0 0 0 1px var(--aiko-line)}
.prices{display:flex;gap:6px;flex:none}
.pwrap{display:flex;align-items:center}
.price{width:66px;background:#100E09;border:1px solid var(--line2);border-radius:7px;color:var(--cream);font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;padding:6px 9px;outline:none;font-variant-numeric:tabular-nums}
.price:focus{border-color:var(--aiko-line)}
.price.err{border-color:var(--bad);background:#fff6f6;color:#1a1400}
.rm{flex:none;width:30px;height:30px;border-radius:7px;color:var(--muted);display:grid;place-items:center;font-size:15px;transition:.13s}
.rm:hover{color:var(--bad);background:rgba(229,103,94,.1)}
.desc{font-size:12.5px;color:var(--cream-dim);margin-top:8px;outline:none;border-radius:5px;padding:4px 6px;margin-left:-6px;margin-right:-6px;line-height:1.5;max-width:58ch}
.desc:focus{background:rgba(233,184,51,.07);box-shadow:inset 0 0 0 1px var(--aiko-line)}
.metarow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.lbl{font-size:10.5px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}
.ctr{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctr.over{color:var(--bad)}
.afchk{display:inline-flex;gap:8px!important;flex-wrap:wrap;margin-top:0!important}
.afchk label{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);font-size:11.5px;letter-spacing:.02em;background:#100E09;cursor:pointer;transition:.13s;user-select:none}
.afchk label:hover{color:var(--cream-dim);border-color:var(--line2)}
.afchk label:has(input:checked){background:var(--aiko-soft);border-color:var(--aiko-line);color:var(--cream)}
.afchk label:has(input:checked) svg{color:var(--aiko)}
.afchk input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.afchk label svg{width:15px;height:15px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--warn);margin-top:8px;min-height:0}
.hint:empty{display:none}
.rmstrip{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px dashed var(--line2);border-radius:10px;margin-bottom:11px;color:var(--muted);font-size:13px}
.rmname{color:var(--cream-dim);text-transform:uppercase;letter-spacing:.4px}
.rmtag{font-size:10.5px;color:var(--bad);border:1px solid rgba(229,103,94,.4);border-radius:20px;padding:1px 8px;letter-spacing:.08em;text-transform:uppercase}
.restore{margin-left:auto;color:var(--aiko);font-size:12px;padding:5px 12px;border:1px solid var(--aiko-line);border-radius:7px;transition:.13s}
.restore:hover{background:var(--aiko-soft)}
.sp{text-decoration:underline wavy rgba(229,103,94,.9);text-underline-offset:3px;cursor:pointer}
.gl{color:var(--bad);text-decoration:underline}
.addzone{margin-top:4px}
.addlink,.addopen{width:100%;padding:12px;border:1.5px dashed var(--line2);border-radius:11px;color:var(--muted);font-size:13px;letter-spacing:.03em;transition:.13s;text-align:center}
.addlink:hover,.addopen:hover{border-color:var(--aiko-line);color:var(--aiko);background:var(--aiko-soft)}
.addform{background:var(--card2);border:1px solid var(--aiko-line);border-radius:12px;padding:14px;margin-top:8px;display:none;flex-direction:column;gap:10px}
.addform.open{display:flex}
.addform input,.addform textarea,.addform select{background:#100E09;border:1px solid var(--line2);border-radius:8px;color:var(--cream);font-family:var(--mono);font-size:13px;padding:8px 10px;outline:none}
.addform input:focus,.addform textarea:focus,.addform select:focus{border-color:var(--aiko-line)}
.addform .af-name{font-weight:700;text-transform:uppercase}
.af-nmeta,.af-dmeta{font-size:11px;color:var(--muted)}
.af-nmeta.bad,.af-dmeta.bad{color:var(--bad)}
.afadd{background:var(--aiko);color:#1a1400;font-weight:700;border-radius:8px;padding:9px;transition:.15s}
.afadd:disabled{opacity:.4;cursor:not-allowed}
.afcancel{color:var(--muted);font-size:12px;padding:8px}
.afchk.af-a-row{gap:8px}
.osel,.af-sec{cursor:pointer}

/* ---- preview ---- */
#previewPane{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;position:relative}
.plabel{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#ptag{color:var(--cream-dim);letter-spacing:.04em;text-transform:none}
#wrap{flex:1;overflow:auto;background:#2a2620;padding:16px;display:flex;justify-content:center;align-items:flex-start;position:relative}
#preview{max-width:100%;height:auto;border-radius:5px;box-shadow:0 20px 50px rgba(0,0,0,.6);background:#fff}
#busy{position:absolute;top:22px;right:22px;background:rgba(16,14,9,.9);color:var(--cream-dim);font-size:11px;padding:5px 10px;border-radius:20px;display:none}
#busy.on{display:block}
.prev-close{display:none;position:absolute;top:11px;right:14px;width:28px;height:28px;border-radius:7px;color:var(--muted);place-items:center;font-size:16px;z-index:2}
.prev-close:hover{color:var(--cream);background:rgba(255,255,255,.06)}

/* ---- popover (spell) ---- */
#popover{position:absolute;display:none;z-index:80;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);min-width:160px}
#popover .word{font-size:11px;color:var(--muted);padding:4px 8px}
#popover button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--cream);font-size:13px}
#popover button:hover{background:var(--aiko-soft)}
#popover .ignore{color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}

/* ---- Chucky + celebrate (restyled, engine drives them) ---- */
#chuckysay{position:fixed;left:16px;bottom:16px;z-index:60;max-width:300px;background:#100E09;color:var(--cream-dim);font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.4;padding:11px 14px;border-radius:13px;border-bottom-left-radius:3px;border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.4);display:none}
#chuckysay.on{display:block;animation:sayin .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes sayin{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
#celebrate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,8,4,.6);backdrop-filter:blur(3px)}
#celebrate.on{display:flex}
#celebrate .cbcard{background:var(--panel);border:1px solid var(--aiko-line);border-radius:20px;padding:30px 44px 34px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;animation:pop .45s cubic-bezier(.18,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1) rotate(0);opacity:1}}
#celebrate .cbcat{width:120px;height:120px;color:var(--aiko)}
#celebrate .cbcat svg{width:100%;height:100%}
#celebrate .cbline{font-family:var(--mono);font-weight:700;font-size:26px;color:var(--cream);letter-spacing:.5px}
#celebrate .cbsub{font-size:12px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(8,6,3,.55);z-index:44;display:none}
.scrim.on{display:block}

@media(max-width:1120px){ main.app{grid-template-columns:190px 1fr minmax(340px,430px)} }
/* Tablet: rail moves to a top strip; editor + preview stay side-by-side ON the page. */
@media(max-width:980px){
  main.app{grid-template-columns:1fr minmax(300px,400px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"rail rail" "editor preview"}
  .rail{grid-area:rail;flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:9px 12px;gap:6px}
  .rail .tabs{margin-bottom:0;flex:none}
  .rail .lbl2{display:none}
  .sec{width:auto;flex:none;white-space:nowrap;padding:7px 12px}
  .sec.on::before{display:none}
  #editor{grid-area:editor}
  #previewPane{grid-area:preview}
  .prevtoggle,.prev-close{display:none!important}
  .search{max-width:190px}
}
/* Phone: stack — preview sits directly below the editor on the same scrolling page. */
@media(max-width:640px){
  html,body{height:auto} body{overflow:auto}
  main.app{display:flex;flex-direction:column;height:auto}
  #editor{overflow:visible;height:auto;padding-bottom:20px}
  #previewPane{border-top:1px solid var(--line);height:auto}
  #wrap{height:70vh}
  .brand .tag{display:none}.search{max-width:150px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.movebtns{display:flex;flex-direction:column;gap:2px;margin-right:8px;flex:none}
.mvb{width:20px;height:15px;line-height:1;padding:0;border-radius:4px;cursor:pointer;
  background:transparent;border:1px solid var(--line,rgba(255,255,255,.14));color:var(--muted,#8F8676);font-size:10px}
.mvb:hover:not(:disabled){border-color:var(--ac,#E0B020);color:var(--ac,#E0B020)}
.mvb:disabled{opacity:.25;cursor:default}
</style>

      for(const id of m.ids){ const d=+( (lay[id]!=null? lay[id] : m.y[id]) - m.y[id] ).toFixed(3); if(d) dy[id]=d; }
      if(!Object.keys(dy).length) continue;
      const secs=sectionsForPage(p);
      for(const id in dy){
        const d=dy[id], ny=m.y[id], h=m.h[id];
        const nf=FM.fields.find(f=>f.id===id);
        if(!nf||removed.has(id)) continue;
        // text runs reach a slot below the name; artwork sits just ABOVE it and must not be
        // claimed from the dish below (see _ownsArt)
        const own=(y,kind)=> kind==='cm'? _ownsArt(ny,y) : _ownsRun(ny,y,h);
        for(const a of anchors){
          if(a.x===null||a.y===null) continue;
          if(!own(a.y,a.kind)) continue;
          // a price's y and its right-align x are composed in ONE rewrite of tm_span by opsForPage,
          // so route it there instead of touching the raw operand (they would collide)
          const pf=priceTm.find(pf=>a.s>=pf.tm_span[0]&&a.e<=pf.tm_span[1]);
          if(pf){ priceShift[pf.id]=(priceShift[pf.id]||0)+d; continue; }
          shiftOps.push({s:a.s,e:a.e,rep:enc(fmtNum(a.y+d))});
        }
      }
    }
  }
  // mark removed items' field ids to skip in text edits
  for(const nf of removedHere) skip.add(nf.id);
  return {deletes,shiftOps,priceShift,skip,removedSlots};
}

function opsForPage(fields, priceShift, skip){
  priceShift = priceShift||{}; 
  const ops=[];
  for(const f of fields){
    if(skip && skip.has(f.id)) continue;
    const hasEdit = (f.id in edits);
    const yShift = (f.role==='price') ? (priceShift[f.id]||0) : 0;
    if(!hasEdit && !yShift) continue;
    const val = hasEdit ? edits[f.id] : f.text;
    if(f.role==='price'){
      if(hasEdit) ops.push({s:f.tj_span[0],e:f.tj_span[1],rep:enc('('+escPdf(val)+')')});
      const digitChange = hasEdit && val.length!==f.text.length;
      if(digitChange || yShift){
        const [a,b,c,d,x,ff]=f.tm_vals, size=a, adv=ADV.price;
        const right = x + f.text.length*adv*size;
        const nx = right - val.length*adv*size;
        ops.push({s:f.tm_span[0],e:f.tm_span[1],rep:enc([a,b,c,d,(digitChange?nx:x),(ff+yShift)].map(fmtNum).join(' '))});
      }
    } else if(f.role==='name'){
      const {lines}=wrapName(val, f.max_chars, f.lines.length);
      f.lines.forEach((pieces,i)=>{
        ops.push({s:pieces[0][0],e:pieces[0][1],rep:enc('('+escPdf(lines[i]||'')+')')});
        for(let k=1;k<pieces.length;k++) ops.push({s:pieces[k][0],e:pieces[k][1],rep:enc('()')});
      });
      for(const td of f.td_spans){ if(td[2]) continue; ops.push({s:td[0],e:td[1],rep:enc('0 0')}); }
    } else if(f.role==='desc'){
      const fit=fitDesc(f, val);
      const B=f.line_spans.length;
      let lines=fit.lines.slice();
      let last=lines.length; while(last>0 && !lines[last-1]) last--;      // drop trailing blanks
      const n=Math.max(B,last); lines=lines.slice(0,n); while(lines.length<n) lines.push('');
      if(Math.abs(fit.size-f.size)>0.005){                                 // auto-shrink -> swap the Tm size
        const tm=descTm(f);
        if(tm) ops.push({s:tm.s,e:tm.e,rep:enc(fmtNum(fit.size)+' 0 0 '+fmtNum(fit.size)+' '+fmtNum(tm.x)+' '+fmtNum(tm.y)+' Tm')});
      }
      const lead=descLead(f);
      f.line_spans.forEach((sp,i)=>{
        if(i<B-1){ ops.push({s:sp[0],e:sp[1],rep:enc('('+escPdf(lines[i]||'')+')')}); return; }
        // last baked span carries any lines beyond the baked count; the block's own Tj closes the final one
        let rep='('+escPdf(lines[i]||'')+')';
        for(let k=i+1;k<n;k++) rep+='Tj\n0 '+fmtNum(lead)+' Td\n('+escPdf(lines[k]||'')+')';
        ops.push({s:sp[0],e:sp[1],rep:enc(rep)});
      });
    } else if(f.role==='header'){
      if(!hasEdit) continue;
      /* Headers are drawn per kerning group — (Ri)Tj 0 Tc 0 Tw (c)Tj 1.471 0 Td (e)Tj — so patching
         the string literals would leave the stale Td offsets behind. Replace the WHOLE run with one
         Tm + Tj. The gold `rg` and the /TTn Tf sit BETWEEN the two runs, so they are untouched. */
      const w=headerAdv(f, val), w0=headerAdv(f, f.display);
      let hx=f.x;
      if(f.kind==='script'){                       // keep its offset from the serif word's right edge
        const sf=FM.fields.find(q=>q.id===f.pair);
        if(sf){ const sv=(sf.id in edits)?edits[sf.id]:sf.display;
                hx=f.x + (headerAdv(sf,sv)-headerAdv(sf,sf.display)); }
      }
      ops.push({s:f.run_span[0],e:f.run_span[1],
        rep:enc(fmtNum(f.size)+' 0 0 '+fmtNum(f.size)+' '+fmtNum(hx)+' '+fmtNum(f.y)+' Tm\n0 Tc 0 Tw\n('+escPdf(val)+')Tj')});
      // The gold flourish under a script word is a stroked path whose cm origin sits INSIDE the
      // word. It cannot stretch, so move it by exactly the delta the word moved — that preserves
      // its baked offset from the word's start. Without this a wider retyped word slides underneath
      // the stationary squiggle and the two collide.
      if(f.flourish_cm && Math.abs(hx-f.x)>0.005)
        ops.push({s:f.flourish_cm[0],e:f.flourish_cm[1],rep:enc(fmtNum(f.flourish_x+(hx-f.x)))});
    } else if(f.role==='grams'){
      if(hasEdit) ops.push({s:f.tj_span[0],e:f.tj_span[1],rep:enc('('+escPdf(val)+')')});
    }
  }
  return ops;
}

// ===================== ADD-ITEM ENGINE (appends native new items) =====================
function jFmt(v){ let s=(+v).toFixed(4).replace(/0+$/,'').replace(/\.$/,''); return s||'0'; }
function jEsc(s){ return normTypo(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function jStamp(parts, tx, ty){
  let out='';
  for(const p of parts){
    const b=p.bytes.replace(/1 0 0 1 -?[\d.]+ -?[\d.]+ cm/, '1 0 0 1 '+jFmt(tx+p.dx)+' '+jFmt(ty+p.dy)+' cm');
    out+=p.color+' '+b+'\n';
  }
  return out;
}
function descWidthFor(sec){           // chars per desc line for a section (mono advance)
  const C=AC, w=(sec.price_right||sec.col_x+233)-sec.col_x-14;
  return Math.max(20, Math.floor(w/(C.adv_name*C.desc_size)));
}
// pack allergen icons left->right from cursor bx, advancing only for present ones
function markerBody(al, bx, baseline){
  const C=AC, geo=C.marker_geo||{}, order=C.marker_order||(BRAND.markers||[]);
  const gap=(C.icon_gap!=null?C.icon_gap:1.7);
  const set=new Set(al); let cur=bx, body='';
  for(const m of order){
    if(!set.has(m)) continue;
    const g=geo[m]||{dy:0,ox:0,w:8};
    if(m==='korea'){   // drawn from vector primitives, not an extracted ICONS template
      const x=cur-(g.ox||0), y=baseline+(g.dy||0);
      body+='q 1 0 0 1 '+jFmt(x)+' '+jFmt(y)+' cm\n'+flagBody('korea')+'Q\n';
      cur+=(g.w||8)+gap; continue;
    }
    if(!ICONS||!ICONS[m]) continue;
    body+=jStamp(ICONS[m], cur-(g.ox||0), baseline+(g.dy||0));   // align icon's visual left to cur
    cur+=(g.w||8)+gap;                                            // advance by real icon width
  }
  return body;
}
// standalone clip-wrapped marker group (for re-stamping an existing item on allergen toggle)
function markerGroup(al, bx, baseline, page){
  const body=markerBody(al,bx,baseline); if(!body) return '';
  const sz=PAGES[page]||[595.276,841.89];
  return '\nq\n0 '+jFmt(sz[1])+' '+jFmt(sz[0])+' '+jFmt(-sz[1])+' re\nW n\n'+body+'Q\n';

// how far an item shifts up when items above it in the same column were removed
function itemShift(f, removedSlots){ let d=0; for(const rs of (removedSlots||[])){ if(f.x>=rs.cmin && f.x<rs.cmax && rs.y>f.y) d+=Math.abs(rs.h); } return d; }

// ---- cuisine-origin flags: tiny PDF-native flags drawn from authored shapes ----
// ROUND flag roundels — exact replica of the menu's Korea taegeuk: Ø≈6.7pt, centre 4.6pt above baseline
const FR=3.35, FCY=4.6, FD=2*FR;
function _re(x,y,w,h){ return jFmt(x)+' '+jFmt(y)+' '+jFmt(w)+' '+jFmt(h)+' re'; }
function _circ(cx,cy,r){ const k=0.5523*r,P=(a,b,c,d,e,f)=>[a,b,c,d,e,f].map(jFmt).join(' ')+' c';
  return jFmt(cx+r)+' '+jFmt(cy)+' m '+P(cx+r,cy+k,cx+k,cy+r,cx,cy+r)+' '+P(cx-k,cy+r,cx-r,cy+k,cx-r,cy)+' '+P(cx-r,cy-k,cx-k,cy-r,cx,cy-r)+' '+P(cx+k,cy-r,cx+r,cy-k,cx+r,cy)+' h'; }
function _star(cx,cy,r){ let pts=''; for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rad=i%2?r*0.42:r; const x=cx+rad*Math.cos(ang), y=cy+rad*Math.sin(ang); pts+=(i?' '+jFmt(x)+' '+jFmt(y)+' l':jFmt(x)+' '+jFmt(y)+' m'); } return pts+' h'; }
function _halfdisk(cx,cy,r,top){ const k=0.5523*r,P=(a,b,c,d,e,f)=>[a,b,c,d,e,f].map(jFmt).join(' ')+' c'; const s=top?1:-1;
  return jFmt(cx-r)+' '+jFmt(cy)+' m '+P(cx-r,cy+s*k,cx-k,cy+s*r,cx,cy+s*r)+' '+P(cx+k,cy+s*r,cx+r,cy+s*k,cx+r,cy)+' h'; }
function flagBody(c){
  // circle centre at (FR, FCY); content fills its bbox and is clipped to the circle
  const CX=FR, CY=FCY, L=CX-FR, B=CY-FR, D=FD;
  const f=(col,p)=>col+' rg\n'+p+'\nf\n';
  let s='q\n'+_circ(CX,CY,FR)+'\nW n\n';                 // clip to circle
  if(c==='japan'){ s+=f('1 1 1',_re(L,B,D,D))+f('0.74 0 0.18',_circ(CX,CY,FR*0.55)); }
  else if(c==='china'){ s+=f('0.85 0.16 0.08',_re(L,B,D,D))+f('1 0.87 0',_star(CX,CY,FR*0.82)); }
  else if(c==='thailand'){ s+=f('0.62 0.1 0.2',_re(L,B,D,D))+f('0.97 0.97 0.98',_re(L,B+D*0.18,D,D*0.64))+f('0.13 0.16 0.34',_re(L,B+D*0.36,D,D*0.28)); }
  else if(c==='india'){ s+=f('1 0.6 0.2',_re(L,B+D*2/3,D,D/3))+f('1 1 1',_re(L,B+D/3,D,D/3))+f('0.05 0.53 0.03',_re(L,B,D,D/3))+'0.05 0.29 0.64 RG 0.35 w\n'+_circ(CX,CY,FR*0.34)+'\nS\n'; }
  else if(c==='srilanka'){ s+=f('1 0.74 0.16',_re(L,B,D,D))+f('0 0.33 0.3',_re(L,B,D*0.22,D))+f('0.93 0.45 0',_re(L+D*0.22,B,D*0.16,D))+f('0.55 0.13 0.16',_re(L+D*0.42,B,D*0.58,D))+f('1 0.74 0.16',_circ(L+D*0.7,CY,FR*0.4)); }
  else if(c==='korea'){ s+=f('1 1 1',_re(L,B,D,D))+f('0.8 0.18 0.23',_halfdisk(CX,CY,FR*0.62,true))+f('0.13 0.23 0.46',_halfdisk(CX,CY,FR*0.62,false)); }
  s+='Q\n';                                              // end clip
  s+='0.42 0.4 0.36 RG\n0.35 w\n'+_circ(CX,CY,FR)+'\nS\n';   // round border
  return s;
}
function addItemHeight(it,sec){ // total vertical space this item needs (name + desc lines)
  const dl=wrapDesc((it.desc||'').toUpperCase(), descWidthFor(sec), 2).lines.filter(Boolean).length;
  return Math.max(sec.slot, 24 + (dl-1)*Math.abs(AC.desc_leading*AC.desc_size));
}
function buildItemJS(it, sec, Y){
  const C=AC, F=C.fonts, NC=C.name_color, IC=C.ink_color;
  const NX=sec.col_x, SZ=sec.name_size||11, adv=C.adv_name*SZ;   // real Aiko mono advance (~0.587 em)
  const NTC=(C.name_tc!=null?C.name_tc:0);                       // names carry -0.024 tracking
  const DDY=(sec.desc_dy!=null?sec.desc_dy:C.desc_dy);
  const DW=descWidthFor(sec), LEAD=C.desc_leading!=null?C.desc_leading:-1.385;
  const nm=(it.name||'').toUpperCase();
  let p=[];
  p.push('BT\n'+NC+'\n'+F.name+' 1 Tf\n'+jFmt(NTC)+' Tc 0 Tw '+jFmt(SZ)+' 0 0 '+jFmt(SZ)+' '+jFmt(NX)+' '+jFmt(Y)+' Tm\n('+jEsc(nm)+')Tj\nET');
  const dlines=wrapDesc((it.desc||'').toUpperCase(), DW, 2).lines.filter(Boolean);
  if(dlines.length){
    let d='BT\n'+NC+'\n'+F.desc+' 1 Tf\n0 Tc 0 Tw '+jFmt(C.desc_size)+' 0 0 '+jFmt(C.desc_size)+' '+jFmt(NX)+' '+jFmt(Y+DDY)+' Tm\n('+jEsc(dlines[0])+')Tj';
    for(let i=1;i<dlines.length;i++) d+='\n0 '+jFmt(LEAD)+' Td\n('+jEsc(dlines[i])+')Tj';
    d+='\nET'; p.push(d);
    // grams: small size-5 tag trailing the last desc line
    if(it.grams){ const gx=NX+(dlines[dlines.length-1].length)*C.adv_name*C.desc_size+4;
      const gy=Y+DDY+(dlines.length-1)*LEAD*C.desc_size;
      p.push('BT\n'+NC+'\n'+F.grams+' 1 Tf\n0 Tc 0 Tw '+jFmt(C.grams_size)+' 0 0 '+jFmt(C.grams_size)+' '+jFmt(gx)+' '+jFmt(gy)+' Tm\n('+jEsc('['+it.grams+'gms]')+')Tj\nET'); }
  }
  const drawPrice=(val,rightX)=>{ val=String(val||''); if(!val) return; const pw=val.length*C.adv_price*C.price_size, px=rightX-pw;
    p.push('BT\n'+NC+'\n'+F.price+' 1 Tf\n'+jFmt(NTC)+' Tc 0 Tw '+jFmt(C.price_size)+' 0 0 '+jFmt(C.price_size)+' '+jFmt(px)+' '+jFmt(Y)+' Tm\n('+jEsc(val)+')Tj\nET'); };
  drawPrice(it.price, sec.price_right);
  if(sec.price_right_2!=null) drawPrice(it.price2, sec.price_right_2);
  // allergen markers — packed via shared geometry
  { const bx=NX+nm.length*adv+(C.marker_gap||7); const mb=markerBody(it.allergens||[], bx, Y); if(mb) p.push(mb.trim()); }
  if(sec.divider_w>0){
    p.push('0 G\n0.464 w\nq 1 0 0 1 '+jFmt(NX)+' '+jFmt(Y+19.5)+' cm\n0 0 m\n'+jFmt(sec.divider_w)+' 0 l\nS\nQ');
  }
  const sz=PAGES[sec.page]||[595.276,841.89], W=sz[0], H=sz[1];
  return '\nq\n0 '+jFmt(H)+' '+jFmt(W)+' '+jFmt(-H)+' re\nW n\n'+p.join('\n')+'\nQ\n';
}
function appendedForPage(p, removedSlots){
  if(!added.length) return '';
  let bySec={};
  added.forEach(it=>{ const s=SECTIONS[it.sec]; if(s && s.page===p){ (bySec[it.sec]=bySec[it.sec]||[]).push(it); } });
  let out='';
  for(const si in bySec){
    const sec=SECTIONS[si];
    let shift=0;  // ride the same reflow as the section's items when something above was removed
    for(const rs of (removedSlots||[])){ if(sec.col_x>=rs.cmin && sec.col_x<rs.cmax && rs.y>sec.last_y) shift+=Math.abs(rs.h); }
    const LH=Math.abs(AC.desc_leading*AC.desc_size);   // desc line height (~8.4pt Aiko)
    let cy=sec.last_y+shift;

      const dist = sec.slot + (prevDesc-2)*LH + (prevName-1)*AC.desc_size*1.93;   // gap depends on the PREVIOUS item's height
      cy -= dist; out += buildItemJS(it,sec,cy);
      prevName = 1; prevDesc = wrapDesc((it.desc||'').toUpperCase(),descWidthFor(sec),2).lines.filter(Boolean).length;
    }

}


// ---- DIVIDER ENGINE: dividers are decoupled from icon-bundling blocks and positioned by their OWN y ----
function _dividerLines(bytes){
  const s = new TextDecoder('latin1').decode(bytes);
  const re = /q 1 0 0 1 (-?[\d.]+) (-?[\d.]+) cm\s+0 0 m\s+([\d.]+) 0 l\s+S\s+Q/g;
  const out=[]; let m;
  while((m=re.exec(s))){ out.push({x:+m[1], y:+m[2], w:+m[3], xs:m[1], ws:m[3], full:[m.index, m.index+m[0].length]}); }
  return out;
}
function dividerOps(divs, removedSlots){
  // Each divider sits just ABOVE the item it precedes (~0.4*pitch above the name top);
  // the first item of a section has no divider above it (section header sits there).
  // Removing an item must consume exactly ONE divider:
  //   - normal item -> the divider directly above its top
  //   - first item  -> the divider directly BELOW its top (above the next item), else
  //                    that line survives and parks itself under the section header
  // Then every surviving divider rides up by the height of each removed slot below it.
  // NOTE: rs.h (slot height) is unreliable for the LAST item of a section (it can be
  // grossly over-estimated), so the delete-window is derived from the column's own
  // divider PITCH, not from rs.h. rs.h is only used for the ride-up shift, where the
  // last-item over-estimate is harmless (nothing sits below the last item).
  const ops=[]; if(!(removedSlots&&removedSlots.length)) return ops;
  const killed=new Set();
  const slots=[...removedSlots].sort((a,b)=>b.y-a.y);
  for(const rs of slots){
    const inCol=o=> o.d.x>=rs.cmin && o.d.x<rs.cmax;
    const colDivs=divs.map((d,i)=>({d,i})).filter(inCol).sort((a,b)=>b.d.y-a.d.y);
    let gaps=[]; for(let k=1;k<colDivs.length;k++) gaps.push(colDivs[k-1].d.y-colDivs[k].d.y);
    let pitch; if(gaps.length){ gaps.sort((a,b)=>a-b); pitch=gaps[gaps.length>>1]; }
    else pitch=Math.min(Math.abs(rs.h)||50, 80);   // single-divider column: clamp bad rs.h
    const G=pitch*0.7;
    // primary: divider sitting just above this item's top
    let pick=colDivs.find(o=>!killed.has(o.i) && o.d.y>rs.y+1 && o.d.y<=rs.y+G);
    // fallback (first item of section): the divider just below its top
    if(!pick) pick=colDivs.find(o=>!killed.has(o.i) && o.d.y<rs.y-1 && o.d.y>=rs.y-G);
    if(pick) killed.add(pick.i);
  }
  divs.forEach((d,i)=>{
    if(killed.has(i)){ ops.push({s:d.full[0], e:d.full[1], rep:enc('')}); return; }
    let shift=0;
    for(const rs of removedSlots){
      if(!(d.x>=rs.cmin && d.x<rs.cmax)) continue;
      if(d.y <= rs.y-Math.abs(rs.h)/2) shift += Math.abs(rs.h);
    }
    if(shift>0) ops.push({s:d.full[0], e:d.full[1], rep:enc('q 1 0 0 1 '+d.xs+' '+fmtNum(d.y+shift)+' cm 0 0 m '+d.ws+' 0 l S Q')});
  });
  return ops;
}

async function regenerate(){
  for(let p=0;p<pageStreams.length;p++){
    const ps=pageStreams[p];
    const st = structuralForPage(p, ps.pristine);
    const skip = new Set();
    if(removed.size){
      const grp=itemsForPage(p);
      for(const it of grp.items){ if(removed.has(it.name.id)){ skip.add(it.name.id); if(it.desc)skip.add(it.desc.id); if(it.grams)skip.add(it.grams.id); for(const pr of it.prices)skip.add(pr.id);} }
    }
    const divs = _dividerLines(ps.pristine);
    const inDiv = (s,e)=> divs.some(d=> d.full[0]<=s && e<=d.full[1]);
    const shiftOps = st.shiftOps.filter(o=> !inDiv(o.s,o.e));   // divider cms handled by own-Y, not block-shift
    let ops = opsForPage(FM.fields.filter(f=>f.page===p), st.priceShift, skip).concat(shiftOps);
    // carve divider spans out of block-deletes so bundled dividers are never collaterally deleted
    let dels=[];
    for(const d of st.deletes){
      const inside = divs.filter(v=> d[0]<=v.full[0] && v.full[1]<=d[1]).sort((a,b)=>a.full[0]-b.full[0]);
      if(!inside.length){ dels.push(d); continue; }
      let cur=d[0];
      for(const v of inside){ if(v.full[0]>cur) dels.push([cur,v.full[0]]); cur=v.full[1]; }
      if(cur<d[1]) dels.push([cur,d[1]]);
    }
    for(const d of dels) ops.push({s:d[0],e:d[1],rep:enc(keepFont(d,p))});
    if(dels.length){
      ops = ops.filter(o=> !dels.some(d=> d[0]<=o.s && o.e<=d[1] && !(o.s===d[0]&&o.e===d[1])) );
    }
    for(const o of dividerOps(divs, st.removedSlots)) ops.push(o);   // reposition/delete each divider by its own Y
    // ---- allergen markers: re-stamp any item whose DESIRED set differs from what's baked in
    // the PDF. Covers both menu-truth corrections (allergens≠baked) and live user toggles. ----
    let markerAddStr='';
    const allerDelSpans=[];
    for(const f of FM.fields){
      if(f.page!==p || f.role!=='name' || removed.has(f.id) || skip.has(f.id)) continue;
      const desired=(f.id in allerEdits)? allerEdits[f.id] : (f.allergens||[]);
      const baked=f.baked||[];
      if([...desired].sort().join(',')===[...baked].sort().join(',')) continue;   // pristine already correct
      for(const sp of (f.marker_stamps||[])) allerDelSpans.push(sp);   // remove this item's baked stamps

const deacc=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');   // JALAPEÑO -> JALAPENO for dictionary lookup
function wordAllowed(raw){

  if(!w || w.length<2) return true;
  if(IGNORED.has(w)||CULINARY.has(w)||MENU.has(w)||BASE.has(w)) return true;
  if(w.endsWith('s') && (BASE.has(w.slice(0,-1))||CULINARY.has(w.slice(0,-1))||MENU.has(w.slice(0,-1)))) return true;
  if(w.includes("'") && BASE.has(w.replace(/'/g,''))) return true;
  // hyphen/slash compounds (IN-HOUSE, SWEET/SOUR): fine if every part is a word
  if(/[-\/]/.test(raw)){ const parts=raw.split(/[-\/]+/).filter(p=>/[A-Za-z]/.test(p)); if(parts.length>1 && parts.every(p=>wordAllowed(p))) return true; }
  return false;
}

function highlightField(el){

  // Uppercase NAMES only. This runs on a 160ms debounce after every keystroke and rewrites
  // innerHTML, so uppercasing here re-shouted descriptions in the DOM and the next input event
  // then captured the shouted text — which defeated the sentence-case fix in the capture path.
  const text=(kind==='name')? normTypo(el.textContent).toUpperCase() : normTypo(el.textContent),
        off=document.activeElement===el?getCaret(el):null;

    for(const ch of tok){ if(allowed.indexOf(ch)===-1){ inner+="<span class='gl' title='“"+esc(ch)+"” isn’t in the menu font'>"+esc(ch)+"</span>"; gb=true; } else inner+=esc(ch); }
    if(!gb && !wordAllowed(tok)) html+="<span class='sp' data-w='"+esc(deacc(tok).replace(/[^A-Za-z']/g,''))+"'>"+inner+"</span>";

function lev(a,b,max){ const m=a.length,n=b.length; if(Math.abs(m-n)>max) return max+1; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ let c=[i],best=i; for(let j=1;j<=n;j++){ const d=a[i-1]===b[j-1]?0:1; c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+d); best=Math.min(best,c[j]); } if(best>max) return max+1; p=c; } return p[n]; }

function itemsForPage(p){
  const names=FM.fields.filter(f=>f.role==='name'&&f.page===p);
  const descs=FM.fields.filter(f=>f.role==='desc'&&f.page===p);
  const grams=FM.fields.filter(f=>f.role==='grams'&&f.page===p);
  const prices=FM.fields.filter(f=>f.role==='price'&&f.page===p);
  const used=new Set();
  // assign each price to the nearest NAME to its left on the same row — column-aware, so it
  // works whether columns are ~260pt (Aiko p0 / Capiche) or ~520pt (Aiko p1) and never lets
  // a left-column name grab a right-column price that shares its row.
  const owner={};
  for(const x of prices){
    let best=null;
    for(const n of names){ const span=15.5*(n.lines.length-1);
      if(n.x<=x.x+1 && x.y<=n.y+6 && x.y>=n.y-span-7){ if(!best||n.x>best.x) best=n; } }
    if(best) owner[x.id]=best.id;
  }
  const items=names.map(n=>{
    const pr=prices.filter(x=>owner[x.id]===n.id).sort((a,b)=>a.x-b.x);
    pr.forEach(x=>used.add(x.id));
    // column-aware, mirroring the grams rule below. The old |dx|<8 window silently dropped a
    // description whose recorded x was wrong and let the dish reach down to the NEXT dish's text
    // instead — editing it then spliced into the wrong dish's bytes.
    const d=descs.filter(x=>x.x>=n.x-2 && x.x<n.x+260 && n.y>x.y && n.y-x.y<62).sort((a,b)=>b.y-a.y)[0]||null;
    const g=grams.filter(x=>x.x>=n.x-2 && x.x<n.x+260 && n.y>x.y && n.y-x.y<62).sort((a,b)=>b.y-a.y)[0]||null;
    return {name:n, prices:pr, desc:d, grams:g, y:n.y, x:n.x};
  }).sort((a,b)=> (Math.abs(a.x-b.x)>40? a.x-b.x : b.y-a.y));

}

/* ---- SECTION MODEL ---------------------------------------------------------------------------
   Sections are DERIVED, not stored: a dish belongs to the section whose col_x is within 140pt and
   whose last_y is at or below it. Reorder has to be gated on this and NOT on pageColumns() — page 1
   is a single column holding RICE + NOODLES + DESSERTS, so a column-scoped move would silently let
   a dish cross into another section.
   Each dish's height is its own pitch to the next dish IN THE SAME SECTION (dishes differ: a 1-line
   description is ~33pt, a 2-line ~41, DIMSUM PLATTER's 3-line more), with the last dish taking the
   section's gap_below. Do NOT use structuralForPage's slotH() for this — it is unreliable for the
   last dish of a section (it reports 94.23 for 1:8, where the real slot is ~33). */

    const sc=(iy-s.last_y)+dx*0.01; if(sc<bs){bs=sc;best=s;} }

const _secModel={};
function sectionModel(p){

  for(const s of secs) out[s.label]={sec:s, ids:[], y:{}, h:{}};
  for(const it of items){ const s=sectionOf(it,secs); if(!s) continue; out[s.label].ids.push(it.name.id); out[s.label].y[it.name.id]=it.y; }
  for(const L in out){ const m=out[L]; m.ids.sort((a,b)=>m.y[b]-m.y[a]);      // top -> bottom
    m.ids.forEach((id,i)=>{ m.h[id]= i<m.ids.length-1? +(m.y[id]-m.y[m.ids[i+1]]).toFixed(2) : (m.sec.gap_below||m.sec.slot||33); });

async function boot(){
  try{
    document.getElementById('bootmsg').textContent='Loading dictionaries…';
    [FM, BASE_LIST, CULINARY_LIST] = await Promise.all([
      fetch('fieldmap.json?v='+Date.now()).then(r=>r.json()),
      fetch('base_words.json?v='+Date.now()).then(r=>r.json()),
      fetch('culinary.json?v='+Date.now()).then(r=>r.json())
    ]);
    BASE=new Set(BASE_LIST); CULINARY=new Set(CULINARY_LIST);
    ALLOWED=FM.allowed; ADV=FM.adv; PAGES=FM.page_sizes; ICONS=FM.icons; SECTIONS=FM.sections||[]; AC=FM.add_const;
    FM.fields.forEach(f=>FIELD[f.id]=f);
    // decode PDF escapes (e.g. \\222) then normalize smart-punctuation baked into the SOURCE menu so the editor shows clean, printable text
    const _pdfEsc=s=>(s||'').replace(/\\([0-7]{1,3})/g,(m,o)=>String.fromCharCode(parseInt(o,8)&0xff)).replace(/\\([()\\])/g,'$1');
    FM.fields.forEach(f=>{ if(f.display) f.display=normTypo(_pdfEsc(f.display)); if(f.text) f.text=normTypo(_pdfEsc(f.text)); });
    for(const f of FM.fields){ if(f.role==='name'||f.role==='desc'){ for(const w of deacc((f.display||'').toLowerCase()).split(/[^a-z']+/)) if(w) MENU.add(w); } }
    try{ const saved=JSON.parse(localStorage.getItem(BRAND.dictKey)||'[]'); saved.forEach(w=>IGNORED.add(w)); }catch(_){}
    document.getElementById('bootmsg').textContent='Loading your menu file…';
    pdfBytesOrig = new Uint8Array(await (await fetch(BRAND.pdf+'?v='+Date.now())).arrayBuffer()); memBaseVer='v'+pdfBytesOrig.length;
    doc = await PDFDocument.load(pdfBytesOrig);
    for(let p=0;p<doc.getPageCount();p++){
      const page=doc.getPage(p); const ref=page.node.get(PDFName.of('Contents'));
      const stream=doc.context.lookup(ref);
      pageStreams.push({ref, dict:stream.dict, pristine:stream.contents.slice()});
    }
    buildEditor(); try{MEM.init();}catch(e){console.error(e);}
    await regenerate(); await renderPreview();
    document.getElementById('boot').style.display='none';
  }catch(e){
    document.getElementById('bootmsg').innerHTML='Couldn’t load. If you opened this file directly, it needs to be <b>served</b> (deploy it, or run a local server). <br>'+esc(String(e));
    console.error(e);
  }
}
