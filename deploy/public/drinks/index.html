<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aiko Drinks · Menu Editor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E0D0B;--panel:#161410;--card:#1E1B15;--card2:#242017;
  --cream:#F4ECDD;--cream-dim:#CFC6B4;--muted:#8F8676;
  --line:rgba(244,236,221,.10);--line2:rgba(244,236,221,.17);
  --red:#A8D93A;--aiko:#A8D93A;--aiko-soft:rgba(168,217,58,.14);--aiko-line:rgba(168,217,58,.45);
  --ok:#5FB07C;--warn:#E0912B;--bad:#E5675E;
  --paper:#F6EFE2;
  --serif:'Lora',Georgia,serif;--mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--mono);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--aiko);color:#1a1400}
#boot{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#boot svg{color:var(--aiko)!important;fill:var(--aiko)!important}
#boot .s{color:var(--muted);font-family:var(--mono);font-size:13px;letter-spacing:.4px}
.spin{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--aiko);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- top bar ---- */
header.bar{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141209,#100E09);position:relative;z-index:20}
.home{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--muted);border:1px solid var(--line2);font-size:15px;text-decoration:none}
.home:hover{color:var(--cream);border-color:var(--aiko-line)}
.brand{display:flex;align-items:center;gap:11px}
.brand .wm{height:30px;width:auto;color:var(--aiko)}
.brand .tag{font-size:10.5px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.homelink{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);margin-right:2px}
.homelink:hover{color:var(--cream)}
.homelink:hover .chucky{transform:translateY(-2px)}
.homelink .chucky{width:30px;height:30px;color:var(--aiko);transition:transform .2s}
.homelink .bhint{font-size:14px}
.homelink .ctag{display:none}
.search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:#100E09;border:1px solid var(--line2);border-radius:9px;padding:7px 11px;transition:.15s}
.search:focus-within{border-color:var(--aiko-line)}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.search input{flex:1;background:none;border:none;outline:none;color:var(--cream);font-family:var(--mono);font-size:13px}
.search input::placeholder{color:var(--muted)}
.search kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:#0d0b07}
.spacer{flex:1}
.pill{font-size:12px;font-weight:600;letter-spacing:.02em;padding:6px 12px;border-radius:999px;border:1px solid;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);border-color:rgba(95,176,124,.4);background:rgba(95,176,124,.08)}
.pill.bad{color:var(--bad);border-color:rgba(229,103,94,.45);background:rgba(229,103,94,.1)}
#fullprev{background:transparent;color:var(--cream,#F4ECDD);border:1px solid var(--line2,rgba(244,236,221,.2));font-weight:600;letter-spacing:.02em;padding:9px 14px;border-radius:9px;font-size:13px;transition:.15s;margin-right:8px}
#fullprev:hover:not(:disabled){border-color:var(--aiko-line,rgba(237,28,36,.42))}
#fullprev:disabled{opacity:.5;cursor:default}
#pstage{position:relative;display:inline-block;line-height:0;max-width:100%}
#hitlayer{position:absolute;inset:0;pointer-events:none;z-index:1}
.hitbox{position:absolute;pointer-events:auto;cursor:pointer;border-radius:4px;transition:background .12s,box-shadow .12s}
.hitbox:hover{background:var(--aiko-soft);box-shadow:inset 0 0 0 1.5px var(--aiko-line)}
.hitbox.sel{background:var(--aiko-soft);box-shadow:inset 0 0 0 1.5px var(--aiko-line)}
.card.flash{animation:cardflash 1.15s ease-out}
@keyframes cardflash{0%,100%{box-shadow:0 0 0 0 transparent}18%{box-shadow:0 0 0 2px var(--aiko)}}
#export{background:var(--aiko);color:#1a1400;font-weight:700;letter-spacing:.03em;padding:9px 16px;border-radius:9px;font-size:13px;transition:.15s}
#export:hover{filter:brightness(1.07);transform:translateY(-1px)}
#publish{background:var(--ok);color:#0d2013;font-weight:700;letter-spacing:.03em;padding:9px 16px;border-radius:9px;font-size:13px;transition:.15s}
#publish:hover{filter:brightness(1.07);transform:translateY(-1px)}
#publish:disabled{opacity:.6;filter:none;transform:none;cursor:default}
#export:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.prevtoggle{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--cream-dim);border:1px solid var(--line2);border-radius:9px;padding:8px 13px}
.prevtoggle:hover{border-color:var(--aiko-line);color:var(--cream)}

/* ---- layout ---- */
main.app{display:grid;grid-template-columns:210px 1fr minmax(400px,560px);height:calc(100dvh - 55px)}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.rail .tabs{display:flex;gap:4px;background:#100E09;border:1px solid var(--line2);border-radius:9px;padding:3px;margin-bottom:12px}
.rail .tabs button{flex:1;font-size:12px;color:var(--muted);padding:6px 8px;border-radius:6px;transition:.13s}
.rail .tabs button.on{background:var(--aiko-soft);color:var(--cream)}
.rail .lbl2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:2px 10px 8px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;color:var(--cream-dim);font-size:12.5px;letter-spacing:.02em;transition:.13s;position:relative}
.sec:hover{background:rgba(255,255,255,.035);color:var(--cream)}
.sec.on{background:var(--aiko-soft);color:var(--cream)}
.sec.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:2px;background:var(--aiko)}
.sec .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:#0d0b07;border:1px solid var(--line);border-radius:20px;padding:1px 8px;min-width:24px;text-align:center}
.sec.on .ct{color:var(--aiko);border-color:var(--aiko-line)}

#editor{overflow-y:auto;padding:20px 24px 70px}
.grouphd{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:14px 2px 8px;scroll-margin-top:14px}
.grouphd.sechd{font-family:var(--serif);font-size:22px;letter-spacing:.2px;text-transform:none;color:var(--cream);border-top:1px solid var(--line);margin-top:10px;padding-top:20px;display:flex;align-items:baseline;gap:10px}
.grouphd.sechd .n{font-size:12px;font-family:var(--mono);color:var(--muted);letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:11px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line2)}
.card:focus-within{border-color:var(--aiko-line);box-shadow:0 0 0 1px var(--aiko-line)}
.card.haswarn{border-color:rgba(224,145,43,.5)}
.nrow{display:flex;align-items:flex-start;gap:12px}
.name{flex:1;min-width:0;font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.4px;color:var(--cream);text-transform:uppercase;outline:none;border-radius:5px;padding:3px 5px;margin:-3px -5px}
.name:focus{background:rgba(233,184,51,.09);box-shadow:inset 0 0 0 1px var(--aiko-line)}
.prices{display:flex;gap:6px;flex:none}
.pwrap{display:flex;align-items:center}
.price{width:66px;background:#100E09;border:1px solid var(--line2);border-radius:7px;color:var(--cream);font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;padding:6px 9px;outline:none;font-variant-numeric:tabular-nums}
.price:focus{border-color:var(--aiko-line)}
.price.err{border-color:var(--bad);background:#fff6f6;color:#1a1400}
.rm{flex:none;width:30px;height:30px;border-radius:7px;color:var(--muted);display:grid;place-items:center;font-size:15px;transition:.13s}
.rm:hover{color:var(--bad);background:rgba(229,103,94,.1)}
.desc{font-size:12.5px;color:var(--cream-dim);margin-top:8px;outline:none;border-radius:5px;padding:4px 6px;margin-left:-6px;margin-right:-6px;line-height:1.5;max-width:58ch}
.desc:focus{background:rgba(233,184,51,.07);box-shadow:inset 0 0 0 1px var(--aiko-line)}
.metarow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.lbl{font-size:10.5px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}
.ctr{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctr.over{color:var(--bad)}
.afchk{display:inline-flex;gap:8px!important;flex-wrap:wrap;margin-top:0!important}
.afchk label{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);font-size:11.5px;letter-spacing:.02em;background:#100E09;cursor:pointer;transition:.13s;user-select:none}
.afchk label:hover{color:var(--cream-dim);border-color:var(--line2)}
.afchk label:has(input:checked){background:var(--aiko-soft);border-color:var(--aiko-line);color:var(--cream)}
.afchk label:has(input:checked) svg{color:var(--aiko)}
.afchk input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.afchk label svg{width:15px;height:15px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--warn);margin-top:8px;min-height:0}
.hint:empty{display:none}
.rmstrip{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px dashed var(--line2);border-radius:10px;margin-bottom:11px;color:var(--muted);font-size:13px}
.rmname{color:var(--cream-dim);text-transform:uppercase;letter-spacing:.4px}
.rmtag{font-size:10.5px;color:var(--bad);border:1px solid rgba(229,103,94,.4);border-radius:20px;padding:1px 8px;letter-spacing:.08em;text-transform:uppercase}
.restore{margin-left:auto;color:var(--aiko);font-size:12px;padding:5px 12px;border:1px solid var(--aiko-line);border-radius:7px;transition:.13s}
.restore:hover{background:var(--aiko-soft)}
.sp{text-decoration:underline wavy rgba(229,103,94,.9);text-underline-offset:3px;cursor:pointer}
.gl{color:var(--bad);text-decoration:underline}
.addzone{margin-top:4px}
.addlink,.addopen{width:100%;padding:12px;border:1.5px dashed var(--line2);border-radius:11px;color:var(--muted);font-size:13px;letter-spacing:.03em;transition:.13s;text-align:center}
.addlink:hover,.addopen:hover{border-color:var(--aiko-line);color:var(--aiko);background:var(--aiko-soft)}
.addform{background:var(--card2);border:1px solid var(--aiko-line);border-radius:12px;padding:14px;margin-top:8px;display:none;flex-direction:column;gap:10px}
.addform.open{display:flex}
.addform input,.addform textarea,.addform select{background:#100E09;border:1px solid var(--line2);border-radius:8px;color:var(--cream);font-family:var(--mono);font-size:13px;padding:8px 10px;outline:none}
.addform input:focus,.addform textarea:focus,.addform select:focus{border-color:var(--aiko-line)}
.addform .af-name{font-weight:700;text-transform:uppercase}
.af-nmeta,.af-dmeta{font-size:11px;color:var(--muted)}
.af-nmeta.bad,.af-dmeta.bad{color:var(--bad)}
.afadd{background:var(--aiko);color:#1a1400;font-weight:700;border-radius:8px;padding:9px;transition:.15s}
.afadd:disabled{opacity:.4;cursor:not-allowed}
.afcancel{color:var(--muted);font-size:12px;padding:8px}
.afchk.af-a-row{gap:8px}
.osel,.af-sec{cursor:pointer}

/* ---- preview ---- */
#previewPane{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;position:relative}
.plabel{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#ptag{color:var(--cream-dim);letter-spacing:.04em;text-transform:none}
#wrap{flex:1;overflow:auto;background:#2a2620;padding:16px;display:flex;justify-content:center;align-items:flex-start;position:relative}
#preview{max-width:100%;height:auto;border-radius:5px;box-shadow:0 20px 50px rgba(0,0,0,.6);background:#fff}
#busy{position:absolute;top:22px;right:22px;background:rgba(16,14,9,.9);color:var(--cream-dim);font-size:11px;padding:5px 10px;border-radius:20px;display:none}
#busy.on{display:block}
.prev-close{display:none;position:absolute;top:11px;right:14px;width:28px;height:28px;border-radius:7px;color:var(--muted);place-items:center;font-size:16px;z-index:2}
.prev-close:hover{color:var(--cream);background:rgba(255,255,255,.06)}

/* ---- popover (spell) ---- */
#popover{position:absolute;display:none;z-index:80;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);min-width:160px}
#popover .word{font-size:11px;color:var(--muted);padding:4px 8px}
#popover button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--cream);font-size:13px}
#popover button:hover{background:var(--aiko-soft)}
#popover .ignore{color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}

/* ---- Chucky + celebrate (restyled, engine drives them) ---- */
#chuckysay{position:fixed;left:16px;bottom:16px;z-index:60;max-width:300px;background:#100E09;color:var(--cream-dim);font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.4;padding:11px 14px;border-radius:13px;border-bottom-left-radius:3px;border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.4);display:none}
#chuckysay.on{display:block;animation:sayin .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes sayin{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
#celebrate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,8,4,.6);backdrop-filter:blur(3px)}
#celebrate.on{display:flex}
#celebrate .cbcard{background:var(--panel);border:1px solid var(--aiko-line);border-radius:20px;padding:30px 44px 34px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;animation:pop .45s cubic-bezier(.18,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1) rotate(0);opacity:1}}
#celebrate .cbcat{width:120px;height:120px;color:var(--aiko)}
#celebrate .cbcat svg{width:100%;height:100%}
#celebrate .cbline{font-family:var(--mono);font-weight:700;font-size:26px;color:var(--cream);letter-spacing:.5px}
#celebrate .cbsub{font-size:12px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(8,6,3,.55);z-index:44;display:none}
.scrim.on{display:block}

@media(max-width:1120px){ main.app{grid-template-columns:190px 1fr minmax(340px,430px)} }
/* Tablet: rail moves to a top strip; editor + preview stay side-by-side ON the page. */
@media(max-width:980px){
  main.app{grid-template-columns:1fr minmax(300px,400px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"rail rail" "editor preview"}
  .rail{grid-area:rail;flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:9px 12px;gap:6px}
  .rail .tabs{margin-bottom:0;flex:none}
  .rail .lbl2{display:none}
  .sec{width:auto;flex:none;white-space:nowrap;padding:7px 12px}
  .sec.on::before{display:none}
  #editor{grid-area:editor}
  #previewPane{grid-area:preview}
  .prevtoggle,.prev-close{display:none!important}
  .search{max-width:190px}
}
/* Phone: stack — preview sits directly below the editor on the same scrolling page. */
@media(max-width:640px){
  html,body{height:auto} body{overflow:auto}
  main.app{display:flex;flex-direction:column;height:auto}
  #editor{overflow:visible;height:auto;padding-bottom:20px}
  #previewPane{border-top:1px solid var(--line);height:auto}
  #wrap{height:70vh}
  .brand .tag{display:none}.search{max-width:150px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

input.name{background:#100E09;border:1px solid var(--line2);font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.4px;text-transform:uppercase;color:var(--cream);padding:8px 10px;border-radius:7px;margin:0;flex:1;min-width:120px}
input.name:focus{border-color:var(--aiko-line);background:#12100a;box-shadow:none}
input.name.err{border-color:var(--bad);background:#fff6f6;color:#1a1400}
input.desc{width:100%;background:#100E09;border:1px solid var(--line2);color:var(--cream-dim);font-family:var(--mono);font-size:13px;padding:8px 10px;border-radius:7px;margin-top:9px;outline:none}
input.desc:focus{border-color:var(--aiko-line)}
input.desc.err{border-color:var(--bad)}
.warnline{flex-basis:100%;font-family:var(--mono);font-size:11.5px;color:var(--bad);display:flex;gap:10px;align-items:center;margin-top:8px}
.warnline.soft{color:var(--muted)}
.warnline .iglink{font:inherit;border:none;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
#fontnote{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:18px;background:#2b2416;color:var(--cream);font-family:var(--mono);font-size:12.5px;padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
#fontnote.on{opacity:1;transform:translateX(-50%) translateY(0)}

.gradrow{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.gradlbl{font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.gradsw{width:74px;height:24px;border-radius:6px;border:1px solid var(--line2);flex:none}
.gradrow input[type=color]{-webkit-appearance:none;appearance:none;width:26px;height:26px;border:1px solid var(--line2);border-radius:6px;background:none;padding:0;cursor:pointer}
.gradrow input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.gradrow input[type=color]::-webkit-color-swatch{border:none;border-radius:4px}
.autogr{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#1a1400;background:var(--aiko);border-radius:7px;padding:6px 11px;font-weight:700}
.autogr:hover{filter:brightness(1.08)}
.addbtn{width:100%;padding:12px;border:1.5px dashed var(--line2);border-radius:11px;color:var(--muted);font-size:13px;letter-spacing:.03em;transition:.13s;margin:6px 0 4px}
.addbtn:hover{border-color:var(--aiko-line);color:var(--aiko);background:var(--aiko-soft)}
.card.addcard{border-color:var(--aiko-line)}
input.price{width:66px;background:#100E09;border:1px solid var(--line2);border-radius:7px;color:var(--cream);font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;padding:6px 9px;outline:none;font-variant-numeric:tabular-nums}
input.price:focus{border-color:var(--aiko-line)}
.vol-wrap{display:inline-flex;align-items:center;gap:4px}
input.volu{width:48px;background:#100E09;border:1px solid var(--line2);border-radius:7px;color:var(--cream-dim);font-family:var(--mono);font-size:13px;text-align:right;padding:6px 7px;outline:none;font-variant-numeric:tabular-nums}
input.volu:focus{border-color:var(--aiko-line)}
.vol-wrap .unit{font-size:11px;color:var(--muted);font-family:var(--mono)}
/* ---- drag-and-drop reorder ---- */

function suggest(word){ word=word.toLowerCase(); const f=word[0],res=[]; const scan=arr=>{ for(const c of arr){ if(c[0]!==f||Math.abs(c.length-word.length)>2) continue; const d=lev(word,c,2); if(d<=2) res.push([d,c]); } }; scan(CULINARY_LIST); scan(BASE_LIST); res.sort((a,b)=>a[0]-b[0]||a[1].length-b[1].length); const seen=new Set(),out=[]; for(const[,c]of res){ if(!seen.has(c)){seen.add(c);out.push(c);} if(out.length>=3) break; } return out; }
function wordAllowed(raw){
  const w = deacc(raw).replace(/[^A-Za-z']/g,'').toLowerCase().replace(/^'+|'+$/g,'');
  if(!w || w.length<2) return true;
  if(IGNORED.has(w)||CULINARY.has(w)||MENU.has(w)||BASE.has(w)) return true;
  if(w.endsWith('s') && (BASE.has(w.slice(0,-1))||CULINARY.has(w.slice(0,-1))||MENU.has(w.slice(0,-1)))) return true;
  if(w.includes("'") && BASE.has(w.replace(/'/g,''))) return true;
  if(/[-\/]/.test(raw)){ const parts=raw.split(/[-\/]+/).filter(p=>/[A-Za-z]/.test(p)); if(parts.length>1 && parts.every(p=>wordAllowed(p))) return true; }
  return false;
}
function nameIssues(v){ const bad=[],warn=[];
  for(const raw of v.split(/\s+/)){ const w=raw.replace(/[^A-Za-z'\-/]/g,''); if(w.replace(/[^A-Za-z]/g,'').length<3) continue;
    if(wordAllowed(w)) continue; const sg=suggest(deacc(w).replace(/[^A-Za-z']/g,''));
    if(sg.length) bad.push(w.toUpperCase()+' \u2192 '+sg[0].toUpperCase()+'?'); else warn.push(w.toUpperCase()); }
  return {bad,warn}; }
function updateGate(){ const pill=document.getElementById('flagpill'), ex=document.getElementById('export');
  let bad=0, soft=0;
  document.querySelectorAll('#editor .warnline').forEach(w=>{ if(w.dataset.level==='bad') bad++; else soft++; });
  if(bad){ pill.className='pill bad'; pill.textContent=bad+' spelling to fix'; ex.disabled=true; }
  else{ pill.className='pill ok'; pill.textContent='All clear'+(soft?' \u00b7 '+soft+' to review':''); ex.disabled=false; } }
function validateNames(){
  document.querySelectorAll('#editor .card').forEach(card=>{
    const inp=card.querySelector('input.name'); if(!inp) return;
    const touched = inp.dataset.added==='1' || (inp.dataset.orig!=null && inp.value.trim()!==inp.dataset.orig);
    let line=card.querySelector('.warnline');
    const clear=()=>{ if(line) line.remove(); inp.classList.remove('err'); };
    if(!touched || !inp.value.trim()){ clear(); return; }
    const {bad,warn}=nameIssues(inp.value);
    if(!bad.length && !warn.length){ clear(); return; }
    if(!line){ line=document.createElement('div'); line.className='warnline'; card.appendChild(line); }
    line.dataset.level=bad.length?'bad':'soft'; line.classList.toggle('soft',!bad.length);
    line.textContent = bad.length ? ('spelling: '+bad.join('  ')) : ('check: '+warn.join(' '));
    const ig=document.createElement('button'); ig.type='button'; ig.className='iglink'; ig.textContent='ignore \u2014 add to dictionary';
    ig.onclick=()=>{ for(const w of (deacc(inp.value).toLowerCase().match(/[a-z']+/g)||[])) IGNORED.add(w); try{ localStorage.setItem(BRAND.dictKey, JSON.stringify([...IGNORED])); }catch(_){} validateNames(); };
    line.appendChild(ig);

}
function fontNote(chars){ let n=document.getElementById('fontnote'); if(!n)return; n.textContent='“'+chars+'” isn’t in this menu’s font — can’t print'; n.classList.add('on'); clearTimeout(n._t); n._t=setTimeout(()=>n.classList.remove('on'),2400); }
function cleanField(v, role){ const al=(FM.allowed&&FM.allowed[role])||''; let out='',drop=''; for(const ch of v){ if(al.indexOf(ch)>=0) out+=ch; else drop+=ch; } if(drop.replace(/\s/g,'')) fontNote(drop.replace(/\s+/g,' ').trim().split('').join(' ')); return out; }

// ---------- flavor -> gradient ----------
const FLAVOR={mango:'#F5A623',passionfruit:'#F2B705',passion:'#F2B705',orange:'#FF8C1A',apricot:'#F6A623',
 lemon:'#F4D03F',lime:'#A3D93A',citrus:'#EBD534',yuzu:'#EBD534',grapefruit:'#F0616B',
 mint:'#3ECF8E',basil:'#4FAE5A',cucumber:'#8FD14F',matcha:'#7FB135',green:'#5BC236',apple:'#8FCB3A',
 berry:'#C0392B',raspberry:'#D6336C',strawberry:'#E8384F',cherry:'#C81D4E',pomegranate:'#B31438',
 blueberry:'#4A69BD',blackberry:'#5B2C8C',grape:'#6A2C91',plum:'#7A2E6B',kala:'#4B2367',khatta:'#4B2367',
 hibiscus:'#C71F5A',rose:'#E56B9F',scarlett:'#E8384F',watermelon:'#F76B7A',peach:'#FFB07C',
 pineapple:'#F6D33C',banana:'#F2E14C',honey:'#E8A93A',ginger:'#E0A44A',
 chamoy:'#C0392B',tamarind:'#8A4B2E',chilli:'#E23B2E',spice:'#D2542E',
 chocolate:'#5A3A2E',coffee:'#4A2E22',cola:'#3A241A',vanilla:'#EFE3C2',coconut:'#F0EBDD',cream:'#F2E7CE',
 thai:'#E08A2E',tea:'#B5651D',boba:'#7A4A2E',soda:'#8FA9BC',fizz:'#7FC4D8',tonic:'#CFE8F0',
 tropical:'#F6A11F',pop:'#F25C54',breeze:'#5AC8E0',kafir:'#9FD24A',kaffir:'#9FD24A',blue:'#3B6FD6',red:'#D8352A'};
const STOP=new Set('and with a of the served no nasty in house from scratch syrup sauce jam ice club soda salt'.split(' '));
function hx2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb01(c){return c.map(x=>Math.max(0,Math.min(1,x/255)));}
function shade(c,f){return c.map(x=> f<=1? x*f : x+(255-x)*(f-1));}
function gradientFor(text){
  const words=(text.toLowerCase().match(/[a-z]+/g)||[]); const hits=[];
  for(const w of words){ if(STOP.has(w))continue; if(FLAVOR[w])hits.push(FLAVOR[w]); else if(w.endsWith('s')&&FLAVOR[w.slice(0,-1)])hits.push(FLAVOR[w.slice(0,-1)]); }
  const uniq=[...new Set(hits)].map(hx2rgb);
  if(!uniq.length) return [rgb01([138,143,163]), rgb01([60,58,72])];
  if(uniq.length===1){ const b=uniq[0]; return [rgb01(shade(b,1.18)), rgb01(shade(b,0.55))]; }
  return [rgb01(uniq[0]), rgb01(shade(uniq[uniq.length-1],0.7))];
}
function rgb2hex(c){return '#'+c.map(x=>Math.round(Math.max(0,Math.min(1,x))*255).toString(16).padStart(2,'0')).join('');}

// ---------- rebuild page from band model ----------
function strips(bottom,h,C0,C1){ const N=90,W=GEO.W; let s='q\n';
  for(let i=0;i<N;i++){ const t=i/(N-1); const r=C0[0]+(C1[0]-C0[0])*t,g=C0[1]+(C1[1]-C0[1])*t,b=C0[2]+(C1[2]-C0[2])*t;
    s+=num(r)+' '+num(g)+' '+num(b)+' rg '+num(i*W/N)+' '+num(bottom)+' '+num(W/N+0.7)+' '+num(h)+' re f\n'; }
  return s+'Q\n'; }
function txt(x,y,size,t,col){ if(!t) return ''; return 'BT\n'+(col||'1 1 1')+' rg /GS0 gs /TT0 1 Tf\n-0.02 Tc '+num(size)+' 0 0 '+num(size)+' '+num(x)+' '+num(y)+' Tm\n('+escPdf(t)+')Tj\nET\n'; }
// width of a string in this page's font. TT0 (MonospaceTypewriter) is effectively monospace, and
// txt() always sets -0.02 Tc, so every glyph advances the same amount.
function aikoAdv(s,size){ return (s||'').length*(((GEO&&GEO.volAdv)||0.586)-0.02)*size; }
function buildPage(){
  const sig=BANDS.filter(b=>b.type==='signature'); const soft=BANDS.find(b=>b.type==='soft');
  const W=GEO.W,H=GEO.H,softH=GEO.softH; const bh=(H-softH)/Math.max(1,sig.length); let out='';
  sig.forEach((b,i)=>{ const top=H-i*bh, bottom=top-bh;
    out+=strips(bottom,bh,b.C0,b.C1);
    out+=txt(GEO.nameX, bottom+bh*0.52, GEO.nameSize, b.name);
    out+=txt(GEO.descX, bottom+bh*0.52-9.5, GEO.descSize, b.desc);
    // volume trails the description, one space clear of it — same relationship the Capiche
    // drinks menus use. No brackets here: this font's subset has no [ or ].
    if(b.vol) out+=txt(GEO.descX+aikoAdv((b.desc||'')+' ',GEO.descSize), bottom+bh*0.52-9.5,
                       GEO.volSize||5, b.vol+'ML', '0.78 0.78 0.78');
    out+=txt(GEO.priceX, bottom+bh*0.46, GEO.priceSize, b.price);
  });
  if(soft){ out+=strips(0,softH,soft.C0,soft.C1);
    const n=soft.lines.length, gap=Math.min(11,(softH-30)/Math.max(1,n-1));
    soft.lines.forEach((l,i)=>{ const y=17+i*gap; out+=txt(GEO.nameX,y,GEO.priceSize,l.name); out+=txt(GEO.priceX,y,GEO.priceSize,l.price); }); }
  return out;
}
async function regenerate(){
  const bytes=enc(buildPage()); const ps=pageStreams[FM.menu_page];
  ps.dict.set(PDFName.of('Length'), PDFNumber.of(bytes.length));
  doc.context.assign(ps.ref, PDFRawStream.of(ps.dict, bytes));
  lastBytes=await doc.save({useObjectStreams:false}); try{MEM.tick();}catch(_){} return lastBytes;
}
function schedulePreview(){ clearTimeout(ptimer); ptimer=setTimeout(async()=>{ await regenerate(); renderPreview(); },320); try{MEM.tick();}catch(_){} }
/* ---------- click the preview to edit ----------
   Invisible boxes over the rendered page (positioned in PERCENT so they hold at any preview
   scale). Clicking a drink scrolls to + highlights its card. Boxes follow the removal reflow. */
let _pvSel=null;
function pvHitLayer(){
  const cv=document.getElementById('preview'); if(!cv) return null;
  let st=document.getElementById('pstage');
  if(!st){ st=document.createElement('div'); st.id='pstage';
    cv.parentNode.insertBefore(st,cv); st.appendChild(cv);
    const hl=document.createElement('div'); hl.id='hitlayer'; st.appendChild(hl); }
  return st.querySelector('#hitlayer');
}
// one box per band on the menu page, in PDF space (y up). Mirrors buildPage()'s layout:
// signature bands stack from the top in equal slices, the soft-drinks band owns the bottom.
function pvBoxes(p){
  if(p!==FM.menu_page) return [];
  const sig=BANDS.filter(b=>b.type==='signature'), soft=BANDS.find(b=>b.type==='soft');
  const H=GEO.H, W=GEO.W, softH=GEO.softH, bh=(H-softH)/Math.max(1,sig.length);
  const out=[];
  sig.forEach((b,i)=>{ const top=H-i*bh; out.push({id:'sig:'+i, x0:4, x1:W-4, top, bot:top-bh}); });
  if(soft){ const n=soft.lines.length, gap=Math.min(11,(softH-30)/Math.max(1,n-1));
    soft.lines.forEach((l,i)=>{ const y=17+i*gap;      // height tied to the gap so rows never overlap
      out.push({id:'soft:'+i, x0:4, x1:W-4, top:y+gap*0.70, bot:y-gap*0.28}); }); }
  return out;
}
function pvSync(){
  const hl=pvHitLayer(); if(!hl) return;
  let boxes; try{ boxes=pvBoxes(activePage); }catch(e){ hl.innerHTML=''; return; }
  const sz=(FM.page_sizes&&FM.page_sizes[activePage])||[280.63,595.28], W=sz[0], H=sz[1];
  hl.innerHTML='';
  for(const b of boxes){
    const d=document.createElement('div');
    d.className='hitbox'+(_pvSel===b.id?' sel':'');
    d.style.left=(b.x0/W*100)+'%'; d.style.width=(Math.max(10,b.x1-b.x0)/W*100)+'%';
    d.style.top=((H-b.top)/H*100)+'%'; d.style.height=(Math.max(8,b.top-b.bot)/H*100)+'%';
    d.title='Click to edit this drink';
    d.addEventListener('click',()=>pvJump(b.id));
    hl.appendChild(d);
  }
}
function pvJump(key){

async function renderPreview(){

    const pdf=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise; if(my!==renderToken){pdf.destroy();return;} pdfjsDoc=pdf;
    const page=await pdf.getPage(activePage+1);
    const pane=document.getElementById('previewPane'); const avail=pane.clientWidth-28;
    const base=page.getViewport({scale:1}); const scale=Math.min(avail/base.width,2.6);
    const vp=page.getViewport({scale:scale*window.devicePixelRatio});
    const cv=document.getElementById('preview'),cx=cv.getContext('2d');

function swatchCss(b){ return 'linear-gradient(90deg,'+rgb2hex(b.C0)+','+rgb2hex(b.C1)+')'; }

   this calls the same regenerate() that Export calls, so the preview and the exported file are the
   same bytes. The PDF reaches the viewer through IndexedDB (same-origin, client-only) — it never
   enters the URL, never hits the network and is never uploaded. The record is one-shot: the viewer
   deletes it the moment it loads, and sweeps anything stale.

   it as a pop-up and block it. */

function pvDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open(PV_DB,1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(PV_STORE)) r.result.createObjectStore(PV_STORE); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

      const r=await fetch('/api/menu-state/'+MEM_BRAND, {signal:AbortSignal.timeout(4000)});
      if(r.ok){ const j=await r.json(); if(j&&j.state) memApply(j.state); }
    }catch(_){ /* no publish yet, or the API is unreachable — pristine baseline stands */ }
    buildEditor(); try{MEM.init();}catch(e){console.error(e);} await regenerate(); await renderPreview();
    document.getElementById('boot').style.display='none'; setTimeout(()=>{ if(typeof sayChucky==='function') sayChucky(); },650);
  }catch(e){ document.getElementById('bootmsg').innerHTML='Couldn’t load. It needs to be <b>served</b> (deploy it). <br>'+esc(String(e)); console.error(e); }
}
// ===================== shell =====================
function syncRail(){ const rail=document.getElementById('rail'); if(!rail)return; rail.querySelectorAll('.sec').forEach(e=>e.remove());
  [...document.querySelectorAll('#editor .sechd')].forEach(h=>{ const b=document.createElement('button'); b.className='sec'; b.dataset.target=h.id;
    const cnt=h.querySelector('.n')?h.querySelector('.n').textContent.replace(/ items?$/,''):'';
    b.innerHTML='<span>'+(h.dataset.sec||'Items')+'</span><span class="ct">'+cnt+'</span>';
    b.onclick=()=>{ const t=document.getElementById(h.id); if(t)t.scrollIntoView({behavior:'smooth',block:'start'}); rail.querySelectorAll('.sec').forEach(x=>x.classList.remove('on')); b.classList.add('on'); if(matchMedia('(max-width:640px)').matches) closeDrawers(); };
    rail.appendChild(b); });
  rail.querySelectorAll('.tabs button').forEach(t=>t.classList.toggle('on',+t.dataset.pg===activePage));
  const q=document.getElementById('q'); if(q&&q.value) filterItems(q.value); }
(function(){ const ed=document.getElementById('editor'); if(!ed)return; ed.addEventListener('scroll',()=>{ const heads=[...ed.querySelectorAll('.sechd')]; if(!heads.length)return; const top=ed.getBoundingClientRect().top+70; let cur=heads[0]; for(const h of heads){ if(h.getBoundingClientRect().top<=top) cur=h; } document.querySelectorAll('#rail .sec').forEach(s=>s.classList.toggle('on',s.dataset.target===cur.id)); },{passive:true}); })();
function filterItems(q){ q=(q||'').trim().toLowerCase(); const nt=nm=>nm?(nm.value!=null?nm.value:nm.textContent):'';
  document.querySelectorAll('#editor .card').forEach(c=>{ const t=(nt(c.querySelector('.name'))+' '+nt(c.querySelector('.desc'))).toLowerCase(); c.style.display=(!q||t.includes(q))?'':'none'; });
  document.querySelectorAll('#editor .sechd').forEach(h=>{ let n=h.nextElementSibling,any=false; while(n&&!n.classList.contains('sechd')){ if(n.classList.contains('card')&&n.style.display!=='none') any=true; n=n.nextElementSibling; } h.style.display=(!q||any)?'':'none'; });
  document.querySelectorAll('#editor .addbtn').forEach(b=>b.style.display=q?'none':''); }
function togglePrev(force){ const p=document.getElementById('previewPane'),s=document.getElementById('scrim'); const open=force!==undefined?force:!p.classList.contains('open'); p.classList.toggle('open',open); document.getElementById('rail').classList.remove('open'); s.classList.toggle('on',open&&matchMedia('(max-width:1080px)').matches); }
function closeDrawers(){ document.getElementById('previewPane').classList.remove('open'); document.getElementById('rail').classList.remove('open'); document.getElementById('scrim').classList.remove('on'); }
document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&!document.activeElement.isContentEditable){e.preventDefault();const q=document.getElementById('q');if(q)q.focus();} });
boot();
</script><script>
// ===== REPORT A BUG -> /api/bug (attaches a preview snapshot + current edit state) =====
(function(){
  if(document.getElementById('bugbtn')) return;
  const css=document.createElement('style'); css.textContent=`
  #bugbtn{position:fixed;right:16px;bottom:16px;z-index:62;background:rgba(20,18,12,.92);color:#CFC6B4;border:1px solid rgba(244,236,221,.16);border-radius:999px;padding:7px 13px;font:12px/1.4 ui-monospace,monospace;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 10px 30px -14px #000}
  #bugbtn:hover{border-color:rgba(240,97,107,.6);color:#F0616B}
  #bugmodal{position:fixed;inset:0;z-index:82;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
  #bugmodal.on{display:flex}
  #bugcard{width:min(460px,94vw);background:#17150f;border:1px solid rgba(244,236,221,.18);border-radius:14px;padding:18px;font-family:ui-monospace,monospace;color:#F4ECDD;box-shadow:0 30px 70px -24px #000}
  #bugcard h3{margin:0 0 4px;font-size:15px}#bugcard p{margin:0 0 12px;font-size:11.5px;color:#8F8676;line-height:1.5}
  #bugcard textarea{width:100%;min-height:92px;background:#0f0d08;border:1px solid rgba(244,236,221,.18);border-radius:9px;color:#F4ECDD;font:inherit;font-size:13px;padding:10px;resize:vertical;box-sizing:border-box}
  #bugcard .r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;align-items:center}
  #bugcard button{font:inherit;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;border:1px solid rgba(244,236,221,.28);background:transparent;color:#F4ECDD}
  #bugcard button.pri{background:#F0616B;border-color:#F0616B;color:#1a0c0d;font-weight:600}
  #bugshot{font-size:11px;color:#7BC96F;margin-top:8px;flex:1;text-align:left}`;
  document.head.appendChild(css);
  const btn=document.createElement('div'); btn.id='bugbtn'; btn.textContent='🐞 Report a bug'; document.body.appendChild(btn);
  const modal=document.createElement('div'); modal.id='bugmodal';
  modal.innerHTML='<div id="bugcard"><h3>Report a bug</h3><p>Describe what looks wrong. A snapshot of the current preview and your edits are attached, so it can be reproduced and fixed without you re-doing anything.</p><textarea id="bugdesc" placeholder="e.g. after removing a drink and adding one, the new drink overlaps the last line"></textarea><div class="r"><span id="bugshot"></span><button id="bugcancel">Cancel</button><button class="pri" id="bugsend">Send report</button></div></div>';
  document.body.appendChild(modal);
  const snap=()=>{ try{ const c=document.getElementById('preview'); if(c&&c.width) return c.toDataURL('image/jpeg',0.5); }catch(_){} return null; };
  btn.onclick=()=>{ modal.classList.add('on'); document.getElementById('bugshot').textContent = snap()?'✓ preview snapshot attached':''; document.getElementById('bugdesc').focus(); };
  const close=()=>modal.classList.remove('on');
  document.getElementById('bugcancel').onclick=close;
  modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
  document.getElementById('bugsend').onclick=async()=>{
    const desc=document.getElementById('bugdesc').value.trim(); if(!desc){ document.getElementById('bugdesc').focus(); return; }
    const sb=document.getElementById('bugsend'); sb.textContent='Sending…'; sb.disabled=true;
    let state=null; try{ if(typeof memSnapshot==='function') state=memSnapshot(); }catch(_){}
    const payload={ editor:(typeof MEM_BRAND!=='undefined'?MEM_BRAND:location.pathname), page:(typeof activePage!=='undefined'?activePage:null), desc, url:location.href, state, shot:snap() };
    try{ const r=await fetch('/api/bug',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}); const j=await r.json();
      if(j.ok){ sb.textContent='Sent ✓'; setTimeout(()=>{ close(); sb.textContent='Send report'; sb.disabled=false; document.getElementById('bugdesc').value=''; },1000); }
      else { sb.textContent='Failed'; sb.disabled=false; }
    }catch(e){ sb.textContent='Failed — offline?'; sb.disabled=false; }
  };
})();

</script>
